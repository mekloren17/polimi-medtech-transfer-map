      c.fillStyle = `rgba(244,242,238,${0.12 + r * 0.38})`; // neutral: colour on this map always means data
      const s = rnd() > 0.9 ? 2 : 1;
      c.fillRect(rnd() * w, rnd() * h, s, s);
    }
    c.strokeStyle = "rgba(244,242,238,0.22)"; c.lineWidth = 1;
    for (let x = 64; x < w; x += 128) for (let y = 96; y < h; y += 128) {
      if (rnd() > 0.55) continue;
      c.beginPath(); c.moveTo(x - 5, y); c.lineTo(x + 5, y); c.moveTo(x, y - 5); c.lineTo(x, y + 5); c.stroke();
    }
  }

  // ---------- layout ----------
  const svg = d3.select("#map");
  const stage = document.querySelector(".stage");
  const world = svg.append("g");
  const chartLayer = world.append("g").attr("class", "graticule").attr("aria-hidden", "true");
  const linkLayer = world.append("g");
  const labelLayer = world.append("g");
  const nodeLayer = world.append("g");
  const reticle = world.append("g").attr("class", "reticle").attr("opacity", 0);
  reticle.append("circle").attr("r", 26);
  reticle.append("path").attr("d", "M-11,-5 v-6 h6 M5,-11 h6 v6 M11,5 v6 h-6 M-5,11 h-6 v-6");
  // The page scrolls on to the findings, so the wheel zooms only with Ctrl/⌘ (trackpad pinch sends Ctrl too)
  const zoom = d3.zoom().scaleExtent([0.4, 6])
    .filter(e => e.type === "wheel" ? (e.ctrlKey || e.metaKey) : !e.button)
    .on("zoom", e => { world.attr("transform", e.transform); updateLabels(e.transform.k); });
  const hint = document.getElementById("zoomHint");
  let hintTimer;
  svg.on("wheel.hint", e => {
    if (e.ctrlKey || e.metaKey) return;
    hint.classList.add("show"); clearTimeout(hintTimer); hintTimer = setTimeout(() => hint.classList.remove("show"), 1400);
  });
  svg.call(zoom).on("dblclick.zoom", null);
  svg.on("click", e => { if (e.target === svg.node()) select(null); });

  let W = 0, H = 0, home_t = d3.zoomIdentity;
  const centers = {};
  const nodes = DATA.nodes.map(n => ({ ...n }));
  const nodeById = new Map(nodes.map(n => [n.id, n]));
  const simLinks = allLinks.map(l => ({ ...l }));
  const degree = new Map();
  allLinks.forEach(l => { degree.set(l.source, (degree.get(l.source) || 0) + 1); degree.set(l.target, (degree.get(l.target) || 0) + 1); });

  // ISTAT macro-areas; the inner placement loosely follows geography (north at the top)
  const AREAS = {
    "North-West": { dx: -0.34, dy: -0.30, short: "NW" }, "North-East": { dx: 0.34, dy: -0.30, short: "NE" },
    "Centre": { dx: 0, dy: 0.02, short: "Centre" }, "South": { dx: 0.32, dy: 0.34, short: "South" },
    "Islands": { dx: -0.32, dy: 0.36, short: "Islands" },
  };
  const areaOf = n => (n.area in AREAS ? n.area : "Centre");
  function home(n) {
    if (n.type === "patent") return n.group in FAMILIES ? n.group : "A61B";
    if (n.type === "spinoff") return "SPINOFF";
    return "AREA:" + areaOf(n);
  }

  function layout() {
    W = stage.clientWidth; H = stage.clientHeight;
    // With startups split over several macro-areas, the family orbit widens to leave them room inside
    const used = Object.keys(AREAS).filter(a => nodes.some(n => n.type === "startup" && areaOf(n) === a));
    const widen = used.length > 1 ? 1.3 : 1;
    const cx = W / 2, cy = H / 2;
    const rx = Math.max(200, Math.min(W * 0.32, 500)) * widen, ry = Math.max(170, Math.min(H * 0.26, 290)) * widen;
    const fams = Object.keys(FAMILIES);
    fams.forEach((f, i) => {
      const a = -Math.PI / 2 + (i * 2 * Math.PI) / fams.length;
      centers[f] = { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) };
    });
    // Only the areas that hold startups get a place; a single area sits in the centre
    used.forEach(a => {
      const d = used.length > 1 ? AREAS[a] : { dx: 0, dy: 0 };
      centers["AREA:" + a] = { x: cx + d.dx * rx * 0.8, y: cy + 10 + d.dy * ry * 0.8 };
    });
    centers.SPINOFF = { x: cx + rx * 1.1, y: cy - ry * 1.05 };
    drawGraticule(cx, cy, rx, ry);
    nodes.forEach(n => {
      n.deg = degree.get(n.id) || 0;
      n.r = n.type === "patent" ? 4 + Math.min(n.deg, 4) * 1.2 : n.type === "spinoff" ? 5 : 3.5 + Math.min(n.deg, 4) * 1.4;
      const c = centers[home(n)];
      let seed = [...n.id].reduce((s, ch) => (s * 31 + ch.charCodeAt(0)) % 9973, 7);
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      n.x = c.x + (rnd() - 0.5) * 80; n.y = c.y + (rnd() - 0.5) * 80;
    });
    const sim = d3.forceSimulation(nodes)
      // Similarity links only nudge: each startup stays in its macro-area and moves to the side facing its patents
      .force("link", d3.forceLink(simLinks).id(d => d.id).distance(l => l.kind === "known" ? 22 : 34).strength(l => l.kind === "known" ? 0.3 : 0.02))
      .force("charge", d3.forceManyBody().strength(-14))
      .force("x", d3.forceX(n => centers[home(n)].x).strength(0.16))
      .force("y", d3.forceY(n => centers[home(n)].y).strength(0.16))
      .force("collide", d3.forceCollide(n => n.r + 2.5))
      .stop();
    for (let i = 0; i < 420; i++) sim.tick();
    svg.attr("viewBox", [0, 0, W, H]);
    // Home view: fit every dot between the top chrome and the bottom bars
    const x0 = d3.min(nodes, n => n.x) - 90, x1 = d3.max(nodes, n => n.x) + 90;
    const y0 = d3.min(nodes, n => n.y) - 40, y1 = d3.max(nodes, n => n.y) + 40;
    const top = 120, bottom = 150, k = Math.min(1, (W - 32) / (x1 - x0), (H - top - bottom) / (y1 - y0));
    home_t = d3.zoomIdentity.translate(W / 2, top + (H - top - bottom) / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  }

  // Star-chart reticle: rings and hour lines around the map centre; the dashed
  // ellipse is the orbit on which the six technology families are placed.
  function drawGraticule(cx, cy, rx, ry) {
    chartLayer.selectAll("*").remove();
    const R = Math.max(rx, ry) * 2.2, step = 70;
    for (let r = step; r <= R; r += step) chartLayer.append("circle").attr("cx", cx).attr("cy", cy).attr("r", r);
    for (let a = 0; a < 360; a += 15) {
      const t = a * Math.PI / 180;
      chartLayer.append("line").attr("x1", cx + step * Math.cos(t)).attr("y1", cy + step * Math.sin(t))
        .attr("x2", cx + R * Math.cos(t)).attr("y2", cy + R * Math.sin(t));
    }
    chartLayer.append("ellipse").attr("class", "orbit").attr("cx", cx).attr("cy", cy).attr("rx", rx).attr("ry", ry)
      .attr("fill", "none").attr("stroke", "rgba(244,242,238,0.16)").attr("stroke-dasharray", "2 6").attr("vector-effect", "non-scaling-stroke");
    const lr = Math.floor(R * 0.72 / step) * step;
    for (let h = 0; h < 24; h += 2) {
      const t = (h / 24) * 2 * Math.PI - Math.PI / 2;
      chartLayer.append("text").attr("x", cx + lr * Math.cos(t)).attr("y", cy + lr * Math.sin(t) + 3).text(`${h}h`);
    }
  }

  // ---------- render ----------
  function nodeColor(d) {
    if (d.type === "patent") return d.orphan ? "#2f7684" : COLORS.patent;
    if (d.type === "spinoff") return COLORS.spinoff;
    return d.noText ? "#6d5a3c" : COLORS.startup;
  }

  function render() {
    const act = new Set(activeLinks().map(l => l.source + ">" + l.target));
    linkLayer.selectAll("line").data(simLinks, d => d.source.id + ">" + d.target.id)
      .join("line")
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y)
      .attr("stroke", d => d.kind === "known" ? COLORS.verified : "#f4f2ee")
      .attr("stroke-opacity", d => d.kind === "known" ? 0.9 : d.low ? 0.3 : 0.5)
      .attr("stroke-width", d => d.kind === "known" ? 1.8 : 0.8 + (d.score - M.threshold) * 18)
      .attr("stroke-dasharray", d => d.low ? "3 3" : null)
      .attr("display", d => act.has(d.source.id + ">" + d.target.id) ? null : "none");

    const g = nodeLayer.selectAll("g.node").data(nodes, d => d.id).join(enter => {
      const e = enter.append("g").attr("class", "node");
      e.append("circle").attr("class", "halo");
      e.append("circle").attr("class", "dot");
      e.append("text").attr("class", "label").attr("y", 4);
      e.on("click", (ev, d) => { ev.stopPropagation(); select(d.id); });
      e.append("title");
      return e;
    });
    g.attr("transform", d => `translate(${d.x},${d.y})`);
    g.select("title").text(d => d.label);
    g.select("circle.halo")
      .attr("r", d => d.r + 4)
      .attr("fill", "none")
      .attr("stroke", d => d.type === "startup" && d.researchless ? COLORS.red : "none")
      .attr("stroke-width", 1.6);
    g.select("circle.dot").attr("r", d => d.r).attr("fill", nodeColor)
      .attr("stroke", d => d.type === "startup" && d.spinoff ? COLORS.verified : "none").attr("stroke-width", 1.5);
    g.select("text.label").text(d => d.type === "patent" ? trim(d.label, 34) : trim(d.label, 24));
    clusterLabels();
    applyFocus();
    updateLabels(d3.zoomTransform(svg.node()).k);
  }

  function clusterLabels() {
    const groups = Object.keys(FAMILIES).concat(Object.keys(AREAS).map(a => "AREA:" + a), ["SPINOFF"]);
    const rows = groups.map(k => {
      const members = nodes.filter(n => home(n) === k);
      if (!members.length) return null;
      let x, y, name, stat;
      if (k.startsWith("AREA:")) {
        const pts = members;
        x = d3.mean(pts, n => n.x); y = d3.max(pts, n => n.y) + 28;
        name = `${k.slice(5)} startups`;
        const linked = members.filter(n => n.deg && !n.spinoff).length;
        stat = `${members.length} · ${linked} linked · ${members.filter(n => n.researchless).length} research-less`;
      } else {
        x = d3.mean(members, n => n.x); y = d3.min(members, n => n.y) - 22;
        if (k === "SPINOFF") { name = "Polimi spin-offs"; stat = `${members.length} medtech or linked`; }
        else { name = `${k} · ${FAMILIES[k]}`; stat = `${members.length} patents · ${members.filter(n => n.orphan).length} orphan`; }
      }
      const short = k.startsWith("AREA:") ? AREAS[k.slice(5)].short : k === "SPINOFF" ? "Spin-offs" : k;
      return { k, x, y, name, stat, short };
    }).filter(Boolean);
    const lab = labelLayer.selectAll("g.cluster-label").data(rows, d => d.k).join(e => {
      const g = e.append("g").attr("class", "cluster-label");
      g.append("text").attr("class", "name");
      g.append("text").attr("class", "stat").attr("dy", 15);
      return g;
    });

    lab.select(".name").text(d => d.name);
    lab.select(".stat").text(d => d.stat);
  }

  function neighbourhood(id) {
    const s = new Set(id ? [id] : []);
    if (id) linksOf(id).forEach(l => { s.add(l.source); s.add(l.target); });
    return s;
  }

  function viewSet() {
    if (state.view.startsWith("area:")) {
      const a = state.view.slice(5), s = new Set(DATA.nodes.filter(n => n.type === "startup" && n.area === a).map(n => n.id));
      activeLinks().forEach(l => { if (s.has(l.target)) s.add(l.source); });
      return s;
    }
    if (state.view === "orphans") return new Set(DATA.orphans.map(p => "P:" + p));
    if (state.view === "researchless") return new Set(DATA.researchless.map(v => "S:" + v));
    if (state.view === "matches") { const s = new Set(); activeLinks().filter(l => l.kind === "similarity").forEach(l => { s.add(l.source); s.add(l.target); }); return s; }
    if (state.view === "verified") { const s = new Set(); activeLinks().filter(l => l.kind === "known").forEach(l => { s.add(l.source); s.add(l.target); }); return s; }
    return null;
  }

  function currentFocus() { return state.selected ? neighbourhood(state.selected) : state.highlight || viewSet(); }

  function updateLabels(k) {
    // Text keeps the same size on screen at every zoom level
    nodeLayer.selectAll("g.node").select("text.label").attr("transform", `scale(${1 / k})`).attr("x", d => (d.r + 5) * k).attr("y", 4);
    labelLayer.selectAll("g.cluster-label").attr("transform", d => `translate(${d.x},${d.y}) scale(${1 / k})`)
      .select(".name").text(d => k < 0.85 ? d.short : d.name);
    labelLayer.selectAll("g.cluster-label").select(".stat").attr("display", k < 0.6 ? "none" : null);
    const focus = currentFocus();
    nodeLayer.selectAll("g.node").select("text.label").attr("display", d => {
      if (state.selected) return focus.has(d.id) ? null : "none";
      if (focus) return focus.has(d.id) && (focus.size <= 40 || d.deg >= 1 || k > 1.6) ? null : "none";
      return (d.deg >= 3 && k >= 0.7) || (d.deg >= 1 && k >= 1.6) || k >= 2.6 ? null : "none";
    });
    labelLayer.attr("opacity", state.selected ? 0.12 : k > 2.2 ? 0.25 : 1);
  }

  function applyFocus() {
    const focus = currentFocus();
    nodeLayer.selectAll("g.node").classed("faded", d => !!focus && !focus.has(d.id));
    linkLayer.selectAll("line").classed("faded", d => !!focus && !(focus.has(d.source.id) && focus.has(d.target.id)));
    const n = state.selected && nodeById.get(state.selected);
    if (n) reticle.attr("transform", `translate(${n.x},${n.y})`).attr("opacity", 1);
    else reticle.attr("opacity", 0);
  }

  function sheetOpen() { return sheet.classList.contains("open"); }
  function zoomTo(idSet, pad = 120) {
    const pts = [...idSet].map(id => nodeById.get(id)).filter(Boolean);
    if (!pts.length) return;
    const side = sheetOpen() && innerWidth > 700 ? Math.min(560, innerWidth) : 0;
    const bottom = sheetOpen() && innerWidth <= 700 ? innerHeight * 0.78 : 0;
    const x0 = d3.min(pts, d => d.x), x1 = d3.max(pts, d => d.x), y0 = d3.min(pts, d => d.y), y1 = d3.max(pts, d => d.y);
    const availW = W - side, availH = H - bottom - 230;
    const k = Math.max(0.6, Math.min(3, Math.min(availW / (x1 - x0 + pad * 2), availH / (y1 - y0 + pad * 2))));
    const t = d3.zoomIdentity.translate(availW / 2, 130 + availH / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    svg.transition().duration(reduced ? 0 : 750).call(zoom.transform, t);
  }
  function resetZoom() { svg.transition().duration(reduced ? 0 : 600).call(zoom.transform, home_t); }

  // ---------- selection, entity sheet ----------
  const sheet = document.getElementById("sheet"), sheetBody = document.getElementById("sheetBody"), sheetKind = document.getElementById("sheetKind");
  const crumbSel = document.getElementById("crumbSel");
  function token(id) { return id ? id.replace(":", "-").replace(/[^A-Za-z0-9._~-]/g, "") : ""; }
  const byToken = new Map(DATA.nodes.map(n => [token(n.id), n.id]));

  function select(id, opts = {}) {
    state.selected = id && byId.has(id) ? id : null;
    if (state.selected && stage.getBoundingClientRect().top < -40) stage.scrollIntoView({ behavior: reduced ? "auto" : "smooth" });
    if (state.selected) {
      stopTour(false);
      openSheet();
      renderEntity(state.selected);
      crumbSel.hidden = false; crumbSel.textContent = trim(byId.get(state.selected).label, 40);
      try { history.replaceState(null, "", "#" + token(state.selected)); } catch (e) {}
      if (!opts.noZoom) zoomTo(neighbourhood(state.selected), 90);
    } else {
      closeSheet();
      crumbSel.hidden = true;
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    }
    applyFocus(); updateLabels(d3.zoomTransform(svg.node()).k);
  }

  function openSheet() { sheet.classList.add("open"); sheet.setAttribute("aria-hidden", "false"); }
  function closeSheet() { sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); }
  document.getElementById("sheetClose").addEventListener("click", () => select(null));
  document.getElementById("crumbMap").addEventListener("click", () => { state.highlight = null; state.view = "all"; select(null); resetZoom(); });

  const KIND = { patent: "Polimi patent", startup: "Startup", spinoff: "Polimi spin-off" };
  function code(n) { return { patent: "PAT", startup: "STU", spinoff: "SPN" }[n.type] + "-" + n.ref.toUpperCase().slice(0, 16); }
  function status(n) {
    if (n.type === "patent") return n.orphan ? (n.industry ? ["Industry partner", "ok"] : ["Orphan", ""]) : ["Matched", "ok"];
    if (n.type === "startup") return n.spinoff ? ["Polimi spin-off", "ok"] : n.researchless ? ["No Polimi tie", ""] : n.noText ? ["Not compared", ""] : ["No match", "ok"];
    return ["Spin-off", "ok"];
  }

  function tldr(n) {
    const L = linksOf(n.id), sims = L.filter(l => l.kind === "similarity"), known = L.filter(l => l.kind === "known");
    if (n.type === "patent") {
      const base = `A Politecnico di Milano patent in ${n.group} (${(FAMILIES[n.group] || "medtech").toLowerCase()}), priority ${n.priority}.`;
      if (known.length) return base + ` Co-filed with ${known.map(l => byId.get(l.target).label).join(", ")}, a Polimi spin-off.`;
      if (sims.length) return base + ` ${sims.length} Italian startup${sims.length > 1 ? "s" : ""} within reach, closest ${byId.get(sims[0].target).label} at ${fmt(sims[0].score)}.`;
      const best = n.bestStartup && byId.get(n.bestStartup);
      return base + (n.industry ? ` Co-filed with ${n.industry}, so it has an industrial partner, but no startup is close.`
        : ` No Italian startup within reach${best ? `: the closest is ${best.label} at ${fmt(n.best)}` : ""}.`);
    }
    if (n.type === "startup") {
      const base = `A Italian innovative startup${n.place ? ` based in ${n.place}` : ""}${n.founded ? `, active since ${n.founded}` : ""}.`;
      if (n.spinoff) return base + " An accredited Polimi spin-off.";
      if (n.noText) return base + " Its website gave no description, so it was not compared with Polimi patents.";
      if (sims.length) return base + ` Close to ${sims.length} Polimi patent${sims.length > 1 ? "s" : ""} with no known tie to Polimi.`;
      return base + ` No Polimi patent at or above ${state.min.toFixed(2)}.`;
    }
    return `An accredited Politecnico di Milano spin-off${n.founded ? `, incorporated in ${n.founded}` : ""}.${known.length ? ` ${known.length} verified link${known.length > 1 ? "s" : ""} on this map.` : ""}`;
  }

  function miniMap(n) {
    const L = linksOf(n.id).slice(0, 7);
    const pts = L.map((l, i) => {
      const other = byId.get(l.source === n.id ? l.target : l.source);
      const a = -Math.PI / 2 + i * 2 * Math.PI / Math.max(L.length, 1);
      return { x: 50 + 30 * Math.cos(a), y: 55 + 30 * Math.sin(a), c: l.kind === "known" ? COLORS.verified : COLORS[other.type] };
    });
    return `<svg viewBox="0 0 100 110" aria-hidden="true">${pts.map(p => `<line x1="50" y1="55" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#f4f2ee" stroke-opacity="0.35" stroke-width="0.8"/>`).join("")}
      ${pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.4" fill="${p.c}"/>`).join("")}
      <circle cx="50" cy="55" r="7" fill="none" stroke="${COLORS.verified}" stroke-width="1.2"/><circle cx="50" cy="55" r="3.6" fill="${COLORS[n.type]}"/></svg>`;
  }

  const href = url => /^https?:/.test(url) ? url : "https://" + url;
  const OUT = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2h6v6M10 2L3 9"/></svg><span class="sr-only"> (opens in a new tab)</span>`;

  function renderEntity(id) {
    const n = byId.get(id), L = linksOf(id);
    const [stamp, stampCls] = status(n);
    sheetKind.innerHTML = `<i class="dotmark" style="background:${COLORS[n.type]}"></i>${esc(KIND[n.type])}`;
    const facts = [];
    let links = "";
    if (n.type === "patent") {
      facts.push(["Publication", `<span class="mono">${esc(n.ref)}</span>`], ["Priority", `<span class="mono">${esc(n.priority)}</span>`],
        ["IPC", `<span class="mono">${esc(n.ipcAll)}</span>`], ["Applicants", esc(n.applicants)]);
      links = `<a class="btn" href="https://worldwide.espacenet.com/patent/search?q=pn%3D${encodeURIComponent(n.ref)}" target="_blank" rel="noopener">Espacenet${OUT}</a>`;
    } else if (n.type === "startup") {
      facts.push(["Company", esc(n.legal)], ["Based in", esc(n.place + (n.region ? `, ${n.region}` : ""))], ["Sector", esc(n.sector)], ["Tax code", `<span class="mono">${esc(n.ref)}</span>`]);
      if (n.website) links = `<a class="btn" href="${esc(href(n.website))}" target="_blank" rel="noopener">Website${OUT}</a>`;
    } else {
      facts.push(["Company", esc(n.legal)], ["Founded", `<span class="mono">${esc(n.founded)}</span>`]);
      links = (n.website ? `<a class="btn" href="${esc(href(n.website))}" target="_blank" rel="noopener">Website${OUT}</a>` : "") +
        `<a class="btn" href="${esc(n.evidence)}" target="_blank" rel="noopener">Polimi TTO page${OUT}</a>`;
    }
    const chips = [`<span class="chip data">${esc(code(n))}</span>`];
    if (n.titleOnly) chips.push(`<span class="chip gap">Title only</span>`);
    if (n.industry) chips.push(`<span class="chip">Industrial partner</span>`);
    sheetBody.innerHTML = `
      <div class="entity-top">
        <div>
          <h2 class="entity-name">${esc(n.label)}</h2>
          <div class="chips">${chips.join("")}</div>
        </div>
        <div class="status" aria-hidden="true">${miniMap(n)}<b style="color:${stampCls ? COLORS.verified : COLORS.red}">${esc(stamp)}</b><span>${L.length} link${L.length === 1 ? "" : "s"} ≥ ${state.min.toFixed(2)}</span></div>
      </div>
      <p class="lead">${esc(tldr(n))}</p>
      ${links ? `<div class="actions">${links}</div>` : ""}
      <h3 class="section-title">${L.length ? `Links (${L.length})` : "No links at this threshold"}</h3>
      ${L.length ? `<div class="links">${L.map(l => linkRow(l, id)).join("")}</div>` : ""}
      ${n.text ? `<h3 class="section-title">${n.type === "patent" ? "Abstract" : "What they do"}</h3><p class="prose">${esc(n.text)}</p>` : ""}
      ${n.mt ? `<p class="note">${n.type === "patent" ? "Title" : "Text"} machine-translated from Italian.</p>` : ""}
      <h3 class="section-title">Facts</h3>
      <dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
    sheetBody.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(b.dataset.go)));
    sheetBody.scrollTop = 0;
  }

  function linkRow(l, id) {
    const other = byId.get(l.source === id ? l.target : l.source);
    if (l.kind === "known") {
      const why = l.relation === "same_company" ? "Same company: accredited Polimi spin-off" : "Co-applicant of the Polimi patent";
      return `<button class="link-row" data-go="${esc(other.id)}"><span class="who">${esc(other.label)}</span><span class="score" style="color:${COLORS.verified}">Verified</span><span class="why">${esc(why)}</span></button>`;
    }
    const w = Math.max(4, Math.min(100, (l.score - 0.4) / 0.3 * 100));
    return `<button class="link-row" data-go="${esc(other.id)}"><span class="who">${esc(trim(other.label, 70))}</span><span class="score">${fmt(l.score)}</span>
      <span class="meter"><i style="width:${w}%"></i></span><span class="why">${esc(l.terms.join(" · "))}${l.low ? " · title-only patent" : ""}</span></button>`;
  }

  // ---------- menu ----------
  const menu = document.getElementById("menu"), menuBtn = document.getElementById("menuBtn"), menuBody = document.getElementById("menuBody");
  function openMenu() { menu.classList.add("open"); menu.setAttribute("aria-hidden", "false"); menuBtn.setAttribute("aria-expanded", "true"); renderMenu(); }
  function closeMenu() { menu.classList.remove("open"); menu.setAttribute("aria-hidden", "true"); menuBtn.setAttribute("aria-expanded", "false"); }
  menuBtn.addEventListener("click", () => menu.classList.contains("open") ? closeMenu() : openMenu());
  document.getElementById("menuClose").addEventListener("click", closeMenu);

  const maxScore = Math.max(M.threshold, ...allLinks.filter(l => l.score).map(l => l.score));
  const VIEWS = [
    ["all", "Everything", `${DATA.nodes.length} dots`],
    ["matches", "Matches only", `${allLinks.filter(l => l.kind === "similarity").length} lines`],
    ["researchless", "Research-less startups", `${DATA.researchless.length}`],
    ["orphans", "Orphan technologies", `${DATA.orphans.length}`],
    ["verified", "Verified ties", `${allLinks.filter(l => l.kind === "known").length}`],
  ];
  const AREA_VIEWS = Object.keys(AREAS).map(a => {
    const k = DATA.nodes.filter(n => n.type === "startup" && n.area === a).length;
    return k ? [`area:${a}`, a, `${k} startups`] : null;
  }).filter(Boolean);
  let listTab = "researchless";
  function renderMenu() {
    menuBody.innerHTML = `
      <div class="menu-group"><h2>Views</h2>${VIEWS.map(([k, t, s]) => `<button class="option" data-view="${k}" aria-pressed="${state.view === k}"><span>${t}</span><small>${s}</small></button>`).join("")}</div>
      ${AREA_VIEWS.length > 1 ? `<div class="menu-group"><h2>Area</h2>${AREA_VIEWS.map(([k, t, s]) => `<button class="option" data-view="${k}" aria-pressed="${state.view === k}"><span>${t}</span><small>${s}</small></button>`).join("")}</div>` : ""}
      <div class="menu-group"><h2>Filters</h2>
        <label class="range" for="minScore"><span>Minimum similarity <b class="mono" id="minOut">${state.min.toFixed(2)}</b></span>
          <input id="minScore" type="range" min="${M.threshold}" max="${(Math.floor(maxScore * 100) / 100).toFixed(2)}" step="0.01" value="${state.min}"></label>
        <label class="check" for="hideLow"><input id="hideLow" type="checkbox" ${state.hideLow ? "checked" : ""}> Hide matches from title-only patents</label>
      </div>
      <div class="menu-group"><h2>Lists</h2>
        <div class="tabs"><button class="option" style="width:auto" data-tab="researchless" aria-pressed="${listTab === "researchless"}">Research-less · ${DATA.researchless.length}</button><button class="option" style="width:auto" data-tab="orphans" aria-pressed="${listTab === "orphans"}">Orphans · ${DATA.orphans.length}</button></div>
        <div class="table-wrap">${listTab === "orphans" ? orphanTable() : rlTable()}</div>
      </div>
      <div class="menu-group"><h2>Legend</h2><div class="legend">
        <span><i style="background:${COLORS.patent}"></i>Polimi patent (darker: orphan)</span>
        <span><i style="background:${COLORS.startup}"></i>Italian startup</span>
        <span><i style="border:2px solid ${COLORS.red}"></i>Research-less startup</span>
        <span><i style="background:${COLORS.spinoff}"></i>Polimi spin-off</span>
        <span><i class="line" style="border-color:${COLORS.verified}"></i>Verified tie</span>
        <span><i class="line" style="border-color:#f4f2ee;border-top-style:dashed"></i>Match from a title-only patent</span></div></div>
      <div class="menu-group"><h2>Sources</h2>
        <p class="note">Patents: Polimi applications in IPC A61B, A61F, A61L, A61M, A61N, G16H (Espacenet), abstracts from EPO Open Patent Services. Startups: InfoCamere register of innovative startups (list of ${esc(M.startupList)}), Italy, ATECO 32.50 / 26.60 or medtech keywords; descriptions from each company's homepage, Italian texts machine-translated (Helsinki-NLP opus-mt-it-en). Spin-offs: Polimi Technology Transfer Office public list (${M.nSpinoffsListed} listed).</p>
        <p class="note">Similarity: cosine between multilingual sentence embeddings (<span class="mono">${esc(M.model)}</span>), threshold ${M.threshold} calibrated on labelled pairs (precision ${M.calPrecision ?? "–"}, recall ${M.calRecall ?? "–"}). Only organisations are shown. Built ${esc(M.built)}.</p>
        <p class="note">Independent research project, not affiliated with or endorsed by Politecnico di Milano.</p>
      </div>`;
    menuBody.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { setView(b.dataset.view); renderMenu(); }));
    menuBody.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { listTab = b.dataset.tab; renderMenu(); }));
    const r = menuBody.querySelector("#minScore");
    r.addEventListener("input", () => { state.min = +r.value; menuBody.querySelector("#minOut").textContent = state.min.toFixed(2); refresh(); });
    menuBody.querySelector("#hideLow").addEventListener("change", e => { state.hideLow = e.target.checked; refresh(); });
    menuBody.querySelectorAll("tr[data-go]").forEach(tr => {
      const go = () => { closeMenu(); select(tr.dataset.go); };
      tr.addEventListener("click", go); tr.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    });
  }
  function rlTable() {
    const rows = DATA.researchless.map(v => byId.get("S:" + v)).filter(Boolean).map(n => {
      const top = linksOf(n.id, allLinks).filter(l => l.kind === "similarity")[0];
      const p = top && byId.get(top.source);
      return `<tr tabindex="0" data-go="${esc(n.id)}"><td>${esc(n.label)}<small>${esc(n.place)}${top && top.low ? " · title-only match" : ""}</small></td><td>${p ? esc(trim(p.label, 60)) : "–"}</td><td class="num">${top ? fmt(top.score) : "–"}</td></tr>`;
    }).join("");
    return `<table><thead><tr><th>Startup</th><th>Closest Polimi patent</th><th style="text-align:right">Score</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  function orphanTable() {
    const rows = DATA.orphans.map(p => byId.get("P:" + p)).filter(Boolean).map(n => {
      const b = n.bestStartup && byId.get(n.bestStartup);
      return `<tr tabindex="0" data-go="${esc(n.id)}"><td>${esc(trim(n.label, 70))}<small>${esc(n.ref)} · ${esc(n.group)}${n.industry ? " · industrial partner" : ""}</small></td><td>${b ? esc(b.label) : "–"}</td><td class="num">${fmt(n.best)}</td></tr>`;
    }).join("");
    return `<table><thead><tr><th>Patent</th><th>Closest startup</th><th style="text-align:right">Best</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  function setView(v) {
    state.view = v; state.highlight = null; stopTour(false); select(null);
    const s = viewSet();
    if (s && s.size) zoomTo(s, 60); else resetZoom();
  }
  function refresh() { render(); if (state.selected) renderEntity(state.selected); }

  // ---------- search ----------
  const search = document.getElementById("search"), q = document.getElementById("q"), results = document.getElementById("results");
  let active = 0, found = [];
  function openSearch() { search.hidden = false; q.value = ""; doSearch(); q.focus(); }
  function closeSearch() { search.hidden = true; document.getElementById("searchBtn").focus(); }
  document.getElementById("searchBtn").addEventListener("click", openSearch);
  search.addEventListener("click", e => { if (e.target === search) closeSearch(); });
  function doSearch() {
    const t = q.value.trim().toLowerCase();
    found = !t ? DATA.researchless.map(v => byId.get("S:" + v)).filter(Boolean).slice(0, 8)
      : DATA.nodes.filter(n => (n.label + " " + n.ref + " " + (n.legal || "") + " " + (n.text || "")).toLowerCase().includes(t))
          .sort((a, b) => (b.label.toLowerCase().includes(t)) - (a.label.toLowerCase().includes(t))).slice(0, 12);
    active = 0;
    results.innerHTML = (!t ? `<span class="caps" style="color:var(--muted);padding:6px 14px">Research-less startups</span>` : "") +
      (found.length ? found.map((n, i) => `<button class="result ${i === active ? "active" : ""}" role="option" data-go="${esc(n.id)}"><i class="dotmark" style="background:${COLORS[n.type]}"></i><span>${esc(trim(n.label, 60))}</span><span>${esc(KIND[n.type])}</span></button>`).join("")
        : `<p class="note" style="padding:6px 14px">Nothing matches “${esc(q.value)}”. Try a company name, a publication number or a word like “stent”.</p>`);
    results.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { closeSearch(); select(b.dataset.go); }));
  }
  q.addEventListener("input", doSearch);
  q.addEventListener("keydown", e => {
    const items = results.querySelectorAll(".result");
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && items.length) {
      e.preventDefault(); active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items.forEach((it, i) => it.classList.toggle("active", i === active));
    } else if (e.key === "Enter" && found[active]) { closeSearch(); select(found[active].id); }
  });

  // ---------- tour and ticker ----------
  const nSim = allLinks.filter(l => l.kind === "similarity");
  const nKnown = allLinks.filter(l => l.kind === "known").length;
  const ids = f => new Set(DATA.nodes.filter(f).map(n => n.id));
  const STEPS = [
    { t: `${M.nPatents} medical patents from Politecnico di Milano`, p: "Every blue dot is a Polimi patent family in the medtech IPC classes, read from Espacenet with its abstract from the EPO Open Patent Services. Inventors are counted, never named.", f: () => ids(n => n.type === "patent") },
    { t: "Six technology families", p: "Patents sit in clusters by their main IPC subclass: diagnosis and surgery, drug delivery, prostheses, biomaterials, electro and radiation therapy, health informatics. This is the biggest: diagnosis and surgery.", f: () => ids(n => n.type === "patent" && n.group === "A61B") },
    { t: `${M.nStartups} Italian medtech startups`, p: `Amber dots are innovative startups registered in Italy (InfoCamere list of ${M.startupList}), grouped by macro-area. ${M.nStartupsText} describe themselves on their website, which is what the map reads; the rest stay dim.`, f: () => ids(n => n.type === "startup") },
    { t: "How a line is drawn", p: `A white line joins a patent and a startup whose texts are semantically close: a score of ${M.threshold} or more on a multilingual embedding model. ${nSim.length} pairs pass. Dashed lines start from patents with only a title, so they are less reliable.`, f: () => { const s = new Set(); nSim.forEach(l => { s.add(l.source); s.add(l.target); }); return s; } },
    { t: "Verified ties", p: `Green marks what public sources confirm: startups that are Polimi spin-offs, and companies that co-filed a Polimi patent. Only ${nKnown} such ties are visible in open data.`, f: () => { const s = new Set(); allLinks.filter(l => l.kind === "known").forEach(l => { s.add(l.source); s.add(l.target); }); return s; } },
    { t: `${DATA.researchless.length} research-less startups`, p: "Red rings mark startups close to a Polimi patent with no known tie to Polimi. Each one is a lead for the Technology Transfer Office to check.", f: () => new Set(DATA.researchless.map(v => "S:" + v)) },
    { t: `${DATA.orphans.length} orphan technologies`, p: `Darker blue dots are patents with no spin-off and no Italian startup within reach. ${DATA.nodes.filter(n => n.orphan && n.industry).length} of them already have an industrial co-applicant, so they are orphan only with respect to startups.`, f: () => new Set(DATA.orphans.map(p => "P:" + p)) },
    { t: "What open data cannot show", p: "Licences and research contracts are not public, and the register covers startups up to five years old. A gap on this map means no tie in open records, among the companies the register covers.", f: () => null },
  ];
  let step = -1;
  const card = document.getElementById("tourCard");
  document.getElementById("tourLabel").textContent = `Data tour · ${STEPS.length}`;
  function showStep(i) {
    closeMenu(); select(null, { noZoom: true });
    step = i;
    const s = STEPS[i], set = s.f();
    state.highlight = set; state.view = "all"; applyFocus(); updateLabels(d3.zoomTransform(svg.node()).k);
    if (set && set.size) zoomTo(set, 70); else resetZoom();
    card.hidden = false;
    card.innerHTML = `<h2>${esc(s.t)}</h2><p>${esc(s.p)}</p>
      <div class="tour-nav"><button class="btn" id="tPrev" ${i === 0 ? "disabled" : ""}>Back</button><span class="count" aria-label="Step ${i + 1} of ${STEPS.length}">${i + 1} / ${STEPS.length}</span><button class="btn" id="tEnd">End tour</button><button class="btn" id="tNext">${i === STEPS.length - 1 ? "Finish" : "Next"}</button></div>`;
    document.getElementById("tPrev").onclick = () => showStep(Math.max(0, step - 1));
    document.getElementById("tNext").onclick = () => step === STEPS.length - 1 ? stopTour(true) : showStep(step + 1);
    document.getElementById("tEnd").onclick = () => stopTour(true);
    document.getElementById("tNext").focus({ preventScroll: true });
  }
  function stopTour(reset) {
    if (step < 0) return;
    step = -1; card.hidden = true; state.highlight = null; applyFocus(); updateLabels(d3.zoomTransform(svg.node()).k);
    if (reset) resetZoom();
  }
  document.getElementById("tourBtn").addEventListener("click", () => showStep(0));

  const FACTS = [
    [M.nPatents, "Polimi medtech patents", 0],
    [M.nStartups, "Italian medtech startups", 2],
    [nSim.length, `matches at ≥ ${M.threshold}`, 3],
    [nKnown, "verified ties", 4],
    [DATA.researchless.length, "startups near Polimi research, no tie", 5],
    [DATA.orphans.length, "patents with no startup in reach", 6],
    ["", "What open data cannot show", 7],
  ];
  const track = document.getElementById("ticker");
  track.innerHTML = FACTS.map(([v, t, n]) => `<button data-step="${n}">${v !== "" ? `<b>${esc(v)}</b>` : ""}${esc(t)}</button>`).join("");
  track.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => showStep(+b.dataset.step)));

  // ---------- method and findings ----------
  const pct = (a, b) => Math.round(100 * a / Math.max(b, 1));
  const N = v => `<span class="num">${esc(v)}</span>`;
  function renderReport() {
    const sims = allLinks.filter(l => l.kind === "similarity"), known = allLinks.filter(l => l.kind === "known");
    const matchedP = new Set(sims.map(l => l.source)), matchedS = new Set(sims.map(l => l.target));
    const rl = DATA.researchless.map(v => byId.get("S:" + v)).filter(Boolean);
    const rlRows = rl.map(n => ({ n, top: linksOf(n.id, allLinks).filter(l => l.kind === "similarity")[0] })).filter(r => r.top);
    // Startups with at least one match on a full abstract; the table shows that match
    const rlHigh = rl.map(n => ({ n, top: linksOf(n.id, allLinks).find(l => l.kind === "similarity" && !l.low) })).filter(r => r.top);
    const orph = DATA.orphans.map(p => byId.get("P:" + p)).filter(Boolean);
    const orphInd = orph.filter(n => n.industry).length;
    const partners = {};
    orph.filter(n => n.industry).forEach(n => n.industry.split(" · ").forEach(c => { const k = c.replace(/\b(SPA|S P A|SRL|S R L|INC|NV|CORP)\b/g, "").replace(/\s+/g, " ").trim(); partners[k] = (partners[k] || 0) + 1; }));
    const topPartners = Object.entries(partners).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${k.replace(/\w\S*/g, w => w[0] + w.slice(1).toLowerCase())} (${v})`);
    const same = known.filter(l => l.relation === "same_company").map(l => byId.get(l.source)?.label).filter(Boolean);
    const coapp = {};
    known.filter(l => l.relation === "co_applicant").forEach(l => { const o = byId.get(l.target)?.label; if (o) coapp[o] = (coapp[o] || 0) + 1; });
    const coappText = Object.entries(coapp).map(([k, v]) => `${k} on ${v} patent${v > 1 ? "s" : ""}`).join(" and ");

    const steps = [
      ["Polimi medtech patents", `${N(M.nPatents)} patent families filed by Politecnico di Milano in the medtech IPC classes (A61B, A61F, A61L, A61M, A61N, G16H), exported from Espacenet. Abstracts come from the EPO Open Patent Services for ${N(M.nAbstracts)} families; ${N(M.nPatents - M.nAbstracts)} older Italian filings are known only by their title. Applicants are kept only when they are organisations.`],
      ["Italian medtech startups", `${M.nItaly ? `The InfoCamere register of innovative startups (list of ${esc(M.startupList)}) holds ${N(M.nItaly.toLocaleString("en"))} companies${M.nRegion !== M.nItaly ? `, ${N(M.nRegion.toLocaleString("en"))} of them in Italy` : ""}. ` : ""}${N(M.nStartups)} are medtech: ${N(M.nByAteco)} by ATECO code 32.50 or 26.60, the rest by medtech keywords. The register has no business description, so each company's homepage was read, respecting robots.txt; ${N(M.nStartupsText)} gave one, and ${N(M.nTranslated)} Italian texts were machine-translated to English.`],
      ["Verified ties", `The ${N(M.nSpinoffsListed)} spin-offs listed by the Polimi Technology Transfer Office were matched to the register by website and name, and patent applicants were matched to spin-offs and startups. Only ${N(known.length)} ties are visible this way.`],
      ["Semantic matching", `Every patent text was compared with every startup description using a multilingual sentence-embedding model (<span class="num">${esc(M.model.split("/").pop())}</span>) and cosine similarity. The threshold of ${N(M.threshold)} was chosen on ${N(M.calPairs || "–")} labelled pairs, where it gives precision ${N(M.calPrecision ?? "–")} and recall ${N(M.calRecall ?? "–")}.${M.maxLinks ? ` Each patent keeps at most its ${N(M.maxLinks)} closest startups, so a broadly worded patent cannot link to dozens of companies on shared vocabulary alone.` : ""} BAAI/bge-m3 was tested too: it removes a language bias but ranked the labelled pairs worse.`],
    ];

    const leads = (rlHigh.length ? rlHigh : rlRows).sort((a, b) => b.top.score - a.top.score).slice(0, 8);
    document.getElementById("reportBody").innerHTML = `
      <header>
        <h2 id="reportTitle">Method and findings</h2>
        <p class="intro">This map asks two questions of open data: which medical technologies developed at Politecnico di Milano have no young company close to them, and which Italian startups work near Polimi research without any visible tie to it.</p>
      </header>

      <section aria-labelledby="hMethod">
        <h3 id="hMethod">What was done</h3>
        <ol class="steps">${steps.map(([t, p]) => `<li><h4>${t}</h4><p>${p}</p></li>`).join("")}</ol>
      </section>

      <section aria-labelledby="hFindings">
        <h3 id="hFindings">What we found</h3>
        <div class="finding">
          <div><h4>${N(DATA.researchless.length)} startups work near Polimi research with no visible tie</h4>
            <p>${N(sims.length)} pairs of a patent and a startup score ${N(M.threshold)} or more, linking ${N(matchedP.size)} patents to ${N(matchedS.size)} startups. ${N(DATA.researchless.length)} of those startups are neither spin-offs nor co-applicants of a Polimi patent; ${N(rlHigh.length)} of them are matched on a full abstract, the rest only on a patent title.</p>
            ${areaSentence(rl)}
            <p>These are leads for the Technology Transfer Office to check: a licence, a research contract or simply an introduction.</p></div>
          <div class="side table-wrap" style="max-height:none"><table class="leads">
            <thead><tr><th>Startup</th><th>Closest Polimi patent</th><th style="text-align:right">Score</th></tr></thead>
            <tbody>${leads.map(({ n, top }) => `<tr tabindex="0" data-go="${esc(n.id)}"><td>${esc(n.label)}<small>${esc(n.place)}</small></td><td>${esc(trim(byId.get(top.source).label, 70))}<small>${esc(top.terms.slice(0, 3).join(" · "))}</small></td><td class="num">${fmt(top.score)}</td></tr>`).join("")}</tbody>
          </table></div>
        </div>
        <div class="finding">
          <div><h4>${N(pct(orph.length, M.nPatents) + "%")} of the patents have no startup in reach</h4>
            <p>${N(orph.length)} of ${N(M.nPatents)} patents have no Italian startup at or above the threshold and no spin-off. ${N(orphInd)} of them were co-filed with a company${topPartners.length ? `, most often ${esc(topPartners.join(", "))}` : ""}, so they already have an industrial route. That leaves ${N(orph.length - orphInd)} technologies with no visible way to market.</p>
            <p>${familySentence(orph)}</p></div>
          <div class="side chart" id="familyChart"></div>
        </div>
        <div class="finding">
          <div><h4>Open data shows only ${N(known.length)} ties</h4>
            <p>${same.length ? `${esc(same.join(" and "))} ${same.length > 1 ? "are" : "is"} both Polimi spin-off${same.length > 1 ? "s" : ""} and registered innovative startup${same.length > 1 ? "s" : ""}. ` : ""}${coappText ? `Among patent applicants, ${esc(coappText)}.` : ""} Licences, research contracts and informal collaborations do not appear in public records, so the real network is certainly denser than this map.</p></div>
          <div class="side"><p>Low numbers here say more about transparency than about technology transfer itself. A public register of university licences would make this map far more precise.</p></div>
        </div>
      </section>

      <section aria-labelledby="hLimits">
        <h3 id="hLimits">Validation and limits</h3>
        <h4 class="sub-h">How the results were checked</h4>
        <ul class="limits checks">
          <li><b>Calibrated threshold.</b> ${N(M.calPairs || "–")} patent–startup pairs were labelled against a written rule, blind to the scores, each with a one-line reason. The labels were drafted with an LLM (Claude) and are being checked by the author. At the chosen threshold the links have precision ${N(M.calPrecision ?? "–")} and recall ${N(M.calRecall ?? "–")} on that set.</li>
          ${M.aucAlt ? `<li><b>Two models compared.</b> ${esc(M.altModel)} removes a language bias but ranked the labelled pairs worse (AUC ${N(M.aucAlt.toFixed(2))} against ${N(M.aucMain.toFixed(2))}), so the multilingual MPNet model was kept.</li>` : ""}
          ${M.maxLinks ? `<li><b>Generic patents contained.</b> A broadly worded digital-health patent matched dozens of startups on shared vocabulary; each patent now keeps at most its ${N(M.maxLinks)} closest startups.</li>` : ""}
          ${M.nGooglePatents ? `<li><b>No title-only matching.</b> The ${N(M.nGooglePatents)} patents without an abstract in the EPO data were completed from their Google Patents descriptions.</li>` : ""}
          <li><b>Personal data removed.</b> Only organisations are published; descriptions naming founders were redacted.</li>
        </ul>
        <h4 class="sub-h">Scope of the study</h4>
        <ul class="limits">
          <li><b>Innovative startups only.</b> The InfoCamere register lists them for at most five years; established companies are outside this map, and ${N(M.nStartups - M.nStartupsText)} startups without a website description could not be compared.</li>
          <li><b>Public records only.</b> Licences and research contracts are not published, so "no visible tie" means no tie in open records.</li>
          <li><b>Closeness, not commercial fit.</b> Similarity measures how close two descriptions are; the map ranks where a conversation is most likely to be useful.</li>
        </ul>
      </section>

      <section aria-labelledby="hRelated">
        <h3 id="hRelated">Related work</h3>
        <p>Each part of this map has precedents; the combination does not seem to. Earlier studies match university texts to company texts, or patents to startups, from a single firm's point of view. This map starts from a university's portfolio, reads young companies from their own websites, compares Italian and English texts with one multilingual model, and reports the gaps.</p>
        <ul class="limits refs">
          <li><b>University research against company websites.</b> Woltmann and Alkærsig trace knowledge transfer by text-mining university publications against company websites and documents (<a href="https://doi.org/10.1007/s11192-018-2849-9" target="_blank" rel="noopener">Scientometrics, 2018</a>).</li>
          <li><b>Patents against startups.</b> Kim, Kim and Sohn match patent abstracts with Crunchbase startup profiles to suggest partners to an acquiring firm (<a href="https://doi.org/10.1016/j.dss.2019.113229" target="_blank" rel="noopener">Decision Support Systems, 2020</a>); Chung, Ko and Yoon look for university inventor groups suited to a firm (<a href="https://ideas.repec.org/a/eee/tefoso/v171y2021ics0040162521004200.html" target="_blank" rel="noopener">Technological Forecasting and Social Change, 2021</a>).</li>
          <li><b>Text similarity between patents.</b> Arts, Cassiman and Gomez show that it agrees with expert judgement (<a href="https://doi.org/10.1002/smj.2699" target="_blank" rel="noopener">Strategic Management Journal, 2018</a>), which is why the threshold here is checked on labelled pairs. Hain et al. and Ascione and Sterzi use and compare text embeddings for it (<a href="https://doi.org/10.1016/j.techfore.2022.121559" target="_blank" rel="noopener">2022</a>, <a href="https://arxiv.org/abs/2403.16630" target="_blank" rel="noopener">2024 preprint</a>).</li>
          <li><b>Firm websites as data.</b> Kinne and Axenbeck show that website availability and content vary with firm size, age and sector (<a href="https://doi.org/10.1007/s11192-020-03726-9" target="_blank" rel="noopener">Scientometrics, 2020</a>): startups without a usable website cannot appear on this map.</li>
        </ul>
      </section>

  // Where the research-less startups are, when the scope spans several regions
  function areaSentence(rl) {
    if (!rl.length || (M.scopeRegions || []).length === 1) return "";
    const lom = rl.filter(n => (n.region || "").toLowerCase() === "lombardia").length;
    const byArea = d3.rollups(rl, v => v.length, n => n.area || "unknown").sort((a, b) => b[1] - a[1]);
    return `<p>${N(lom)} of them are in Lombardy, a short trip from the Politecnico, and ${N(rl.length - lom)} elsewhere in Italy. By macro-area: ${byArea.map(([a, v]) => `${esc(a)} ${N(v)}`).join(", ")}.</p>`;
  }

  // Most isolated families (share of patents with no startup, at least 5 patents) and the family with most matches
  function familySentence(orph) {
    const fam = n => (n.group in FAMILIES ? n.group : "A61B");
    const stats = Object.keys(FAMILIES).map(f => {
      const total = DATA.nodes.filter(n => n.type === "patent" && fam(n) === f).length;
      const o = orph.filter(n => fam(n) === f).length;
      return { f, total, o, share: total ? o / total : 0, matched: total - o };
    }).filter(r => r.total >= 5);
    if (!stats.length) return "";
    const iso = [...stats].sort((a, b) => b.share - a.share).slice(0, 2);
    const best = [...stats].sort((a, b) => b.matched - a.matched)[0];
    const name = r => `${esc(FAMILIES[r.f].toLowerCase())} (${N(r.o + " of " + r.total)})`;
    return `The most isolated families are ${iso.map(name).join(" and ")}. ${esc(FAMILIES[best.f])} has the most patents with a startup in reach: ${N(best.matched)}.`;
  }

  // Patents per technology family: matched, orphan with an industrial co-applicant, orphan
  function drawFamilyChart() {
    const box = document.getElementById("familyChart"); if (!box) return;
    const rows = Object.keys(FAMILIES).map(f => {
      const ps = DATA.nodes.filter(n => n.type === "patent" && (n.group in FAMILIES ? n.group : "A61B") === f);
      const orphan = ps.filter(n => n.orphan && !n.industry).length, partner = ps.filter(n => n.orphan && n.industry).length;
      return { f, matched: ps.length - orphan - partner, partner, orphan, total: ps.length };
    }).filter(r => r.total).sort((a, b) => b.total - a.total);
    const w = Math.max(280, box.clientWidth || 560), labelW = Math.min(230, w * 0.42), barW = w - labelW - 44, rowH = 34;
    const x = d3.scaleLinear().domain([0, d3.max(rows, r => r.total)]).range([0, barW]);
    const C = { matched: COLORS.patent, partner: "#a9a59d", orphan: "#2f7684" };
    let y = 0, out = "";
    rows.forEach(r => {
      out += `<text x="0" y="${y + 21}" fill="#f4f2ee" font-size="13" font-family="Archivo, sans-serif" font-weight="600">${r.f}<tspan fill="#9b978f" font-weight="500"> · ${esc(FAMILIES[r.f])}</tspan></text>`;
      let x0 = labelW;
      [["matched", r.matched], ["partner", r.partner], ["orphan", r.orphan]].forEach(([k, v]) => {
        if (v) out += `<rect x="${x0.toFixed(1)}" y="${y + 8}" width="${Math.max(1, x(v) - 1.5).toFixed(1)}" height="18" rx="2" fill="${C[k]}"><title>${r.f}: ${v} ${k}</title></rect>`;
        x0 += x(v);
      });
      out += `<text x="${(x0 + 8).toFixed(1)}" y="${y + 21}" fill="#f4f2ee" font-size="12" font-family="'Fragment Mono', monospace">${r.total}</text>`;
      y += rowH;
    });
    box.innerHTML = `<svg viewBox="0 0 ${w} ${y}" role="img" aria-label="Patents per technology family: matched, orphan with an industrial partner, orphan">${out}</svg>
      <div class="legend-row"><span><i style="background:${C.matched}"></i>Startup in reach or known tie</span><span><i style="background:${C.partner}"></i>Orphan, industrial co-applicant</span><span><i style="background:${C.orphan}"></i>Orphan</span></div>`;
  }
