<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polimi MedTech Transfer Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Fragment+Mono&display=swap">
<style>
/* Layout: a full-screen night map of technology families; chrome floats at the edges
   (menu, title, search on top; breadcrumb under it; tour bar at the bottom; entity sheet on demand). */
:root {
  color-scheme: dark;
  --ink: #0b0b0c;
  --ink-2: #141416;
  --ink-3: #1d1d21;
  --paper: #f2efe8;
  --fg: #f4f2ee;
  --muted: #9b978f;
  --line: rgba(244, 242, 238, 0.14);
  --red: #ff3b30;
  --verified: #34d27b;
  --patent: #5fd3e6;
  --startup: #ffb23e;
  --spinoff: #b38cff;
  --font-display: "Archivo", "Arial Black", system-ui, sans-serif;
  --font-body: "Archivo", "Segoe UI", system-ui, sans-serif;
  /* Monospace only for data: publication numbers, tax codes, scores, IPC codes */
  --font-mono: "Fragment Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
::selection { background: var(--startup); color: var(--ink); }
* { scrollbar-color: #3a3a41 transparent; scrollbar-width: thin; }
input { caret-color: var(--startup); }
body {
  margin: 0; background: var(--ink); color: var(--fg); overflow-x: hidden;
  font: 15px/1.5 var(--font-body);
}
button { font: inherit; color: inherit; }
a { color: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.caps { font: 600 12px var(--font-body); font-stretch: 112%; text-transform: uppercase; letter-spacing: 0.08em; }

/* Sky */
.stage { position: relative; height: 100vh; height: 100dvh; min-height: 520px; overflow: hidden; }
#sky { position: absolute; inset: 0; background: var(--ink); }
#stars { position: absolute; inset: 0; width: 100%; height: 100%; }
/* pan-y: a vertical swipe scrolls the page to the findings; pinch and horizontal drag move the map */
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
.graticule line, .graticule circle { fill: none; stroke: rgba(255, 255, 255, 0.2); stroke-width: 1; vector-effect: non-scaling-stroke; }
.graticule .orbit { stroke: rgba(255, 255, 255, 0.45); stroke-dasharray: 2 6; }
.graticule text { font: 400 10px var(--font-mono); fill: rgba(255, 255, 255, 0.5); text-anchor: middle; }
.zoom-hint {
  position: absolute; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none;
  background: rgba(20, 20, 22, 0.92); border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; font-weight: 600;
  opacity: 0; transition: opacity 0.2s ease-out;
}
.zoom-hint.show { opacity: 1; }
#map:active { cursor: grabbing; }

/* Top chrome */
.top {
  position: absolute; inset: 0 0 auto; z-index: 20; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 12px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; background: linear-gradient(var(--ink) 0%, rgba(11, 11, 12, 0) 100%);
}
.top > * { pointer-events: auto; }
.round {
  width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: rgba(20, 20, 22, 0.8);
  display: grid; place-items: center; cursor: pointer;
}
.round:hover, .round:focus-visible { border-color: var(--fg); outline: none; }
.round svg { width: 18px; height: 18px; stroke: var(--fg); fill: none; stroke-width: 1.8; }
h1.brand {
  margin: 0; text-align: center; font-family: var(--font-display); font-weight: 850; font-stretch: 125%;
  font-size: clamp(18px, 3.4vw, 34px); letter-spacing: 0.02em; text-transform: uppercase; line-height: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
}
h1.brand small { display: block; font: 500 12px var(--font-body); font-stretch: 100%; letter-spacing: 0.04em; text-transform: none; color: var(--muted); margin-top: 8px; }
.crumbs { position: absolute; z-index: 19; left: 50%; transform: translateX(-50%); top: calc(96px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; max-width: calc(100% - 32px); }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: rgba(20, 20, 22, 0.85); border-radius: 999px; padding: 6px 14px;
  cursor: pointer; white-space: nowrap; max-width: 60vw; overflow: hidden; text-overflow: ellipsis;
}
.pill.light { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.pill:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* Map marks */
.cluster-label { pointer-events: none; text-anchor: middle; }
.cluster-label .name { font: 700 13px var(--font-display); font-stretch: 112%; letter-spacing: 0.12em; fill: var(--fg); text-transform: uppercase; paint-order: stroke; stroke: var(--ink); stroke-width: 4px; }
.cluster-label .stat { font: 500 11px var(--font-body); fill: var(--muted); paint-order: stroke; stroke: var(--ink); stroke-width: 4px; }
.node { cursor: pointer; }
.node .label { font: 600 12px var(--font-body); fill: var(--fg); paint-order: stroke; stroke: var(--ink); stroke-width: 3.5px; pointer-events: none; }
.faded { opacity: 0.12; }
.reticle { pointer-events: none; }
.reticle circle { fill: none; stroke: rgba(244, 242, 238, 0.55); stroke-width: 1; }
.reticle path { fill: none; stroke: var(--fg); stroke-width: 1.6; }

/* Bottom chrome */
.tourbar {
  position: absolute; z-index: 18; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(14, 14, 16, 0.92); padding: 6px; overflow: hidden;
}
.tour-start { flex: none; display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 4px; background: transparent; cursor: pointer; }
.tour-start .play { width: 30px; height: 30px; border-radius: 50%; background: var(--red); display: grid; place-items: center; }
.tour-start .play svg { width: 12px; height: 12px; fill: var(--fg); }
.tour-start:focus-visible { outline: 2px solid var(--fg); }
.ticker { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; mask-image: linear-gradient(90deg, #000 92%, transparent); }
.ticker::-webkit-scrollbar { display: none; }
.ticker-track { display: inline-flex; gap: 6px; white-space: nowrap; padding-right: 32px; }
.ticker button { border: 0; background: transparent; cursor: pointer; padding: 6px 10px; border-radius: 999px; font-size: 14px; color: var(--muted); }
.ticker button b { color: var(--fg); font: 400 14px var(--font-mono); margin-right: 6px; }
.ticker button:hover, .ticker button:focus-visible { color: var(--fg); background: var(--ink-3); outline: none; }
.to-report { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); text-decoration: none; font-weight: 600; font-size: 14px; }
.to-report:hover, .to-report:focus-visible { border-color: var(--fg); outline: none; }
.to-report svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }

/* Sheets */
.sheet {
  position: fixed; z-index: 30; right: 0; top: 0; bottom: 0; width: min(560px, 100%);
  background: var(--ink-2); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  transform: translateX(105%); transition: transform 0.35s cubic-bezier(.2,.7,.2,1); box-shadow: -30px 0 60px rgba(0, 0, 0, 0.45);
  visibility: hidden;
}
.sheet.open { transform: none; visibility: visible; }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line);
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
}
.sheet-head .caps { display: inline-flex; align-items: center; gap: 10px; }
.dotmark { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.close { border: 0; background: transparent; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; }
.close:hover, .close:focus-visible { background: var(--ink-3); outline: none; }
.close svg { width: 16px; height: 16px; stroke: var(--fg); stroke-width: 2; }
.sheet-body { overflow-y: auto; padding: 24px 20px calc(32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 20px; align-content: start; }
.entity-top { display: grid; grid-template-columns: minmax(0, 1fr) 132px; gap: 20px; align-items: start; }
.entity-name { margin: 0 0 14px; font: 850 clamp(28px, 4.4vw, 44px)/1.02 var(--font-display); font-stretch: 105%; letter-spacing: -0.01em; overflow-wrap: anywhere; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font: 600 13px var(--font-body); }
.chip.data { font: 400 12px var(--font-mono); color: var(--muted); }
.chip.gap { color: var(--red); border-color: rgba(255, 59, 48, 0.45); }
.lead { margin: 0; font-size: 19px; line-height: 1.45; max-width: 46ch; text-wrap: pretty; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; background: transparent; cursor: pointer; text-decoration: none; font: 600 13px var(--font-body); }
.btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }
.btn:hover, .btn:focus-visible { border-color: var(--fg); outline: none; }
.btn:disabled { opacity: 0.4; cursor: default; }
.section-title { margin: 8px 0 -6px; font: 650 15px var(--font-body); font-stretch: 105%; color: var(--fg); }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.facts dt { color: var(--muted); font-size: 14px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.prose { color: #cfcbc3; margin: 0; max-width: 62ch; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.links { display: grid; gap: 8px; }
.link-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--ink-3); cursor: pointer; text-align: left; width: 100%;
}
.link-row:hover, .link-row:focus-visible { border-color: rgba(244, 242, 238, 0.45); outline: none; }
.link-row .who { font-weight: 650; overflow-wrap: anywhere; }
.link-row .score { font: 500 13px var(--font-mono); }
.link-row .why { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.meter { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--fg); }

/* Status: the entity's standing plus its neighbourhood, drawn from the same links as the map */
.status { display: grid; gap: 8px; justify-items: center; text-align: center; }
.status svg { width: 100%; aspect-ratio: 1; border: 1px solid var(--line); border-radius: 12px; }
.status b { font: 800 12px/1.2 var(--font-display); font-stretch: 112%; letter-spacing: 0.06em; text-transform: uppercase; }
.status span { font: 400 12px var(--font-mono); color: var(--muted); }

/* Menu drawer */
.drawer { right: auto; left: 0; border-left: 0; border-right: 1px solid var(--line); width: min(440px, 100%); transform: translateX(-105%); }
.menu-group { display: grid; gap: 10px; }
.menu-group h2 { margin: 0; font: 650 15px var(--font-body); font-stretch: 105%; }
.option { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; text-align: left; width: 100%; }
.option[aria-pressed="true"] { border-color: var(--fg); background: var(--ink-3); }
.option:focus-visible { outline: 2px solid var(--fg); }
.option small { color: var(--muted); font-family: var(--font-mono); font-size: 13px; }
.range { display: grid; gap: 6px; }
.range input { width: 100%; accent-color: var(--red); }
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--red); }
.legend { display: grid; gap: 8px; font-size: 14px; }
.legend span { display: flex; align-items: center; gap: 10px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.legend i.line { height: 0; width: 20px; border-radius: 0; border-top: 2px solid; }

/* Lists */
.table-wrap { overflow: auto; max-height: 360px; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 600 12px var(--font-body); color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--ink-2); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td, tbody tr:focus-visible td { background: var(--ink-3); }
tbody tr:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
td.num { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
td small { display: block; color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }

/* Search */
.search { position: fixed; z-index: 40; inset: 0; background: rgba(8, 8, 9, 0.86); display: grid; align-content: start; justify-items: center; padding: calc(90px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.search-box { width: min(620px, 100%); display: grid; gap: 10px; }
.search input { width: 100%; padding: 16px 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--ink-2); color: var(--fg); font: 500 18px var(--font-body); }
.search input:focus { outline: none; border-color: var(--fg); }
.results { display: grid; gap: 4px; max-height: 60vh; overflow-y: auto; }
.result { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left; width: 100%; }
.result:hover, .result.active, .result:focus-visible { background: var(--ink-3); border-color: var(--line); outline: none; }
.result span:last-child { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }

/* Tour card */
.tour-card {
  position: absolute; z-index: 25; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  width: min(420px, calc(100% - 32px)); background: var(--ink-2); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}
.tour-card h2 { margin: 0; font: 850 24px/1.1 var(--font-display); font-stretch: 110%; text-wrap: balance; }
.tour-card p { margin: 0; color: #cfcbc3; }
.tour-nav { display: flex; align-items: center; gap: 10px; }
.tour-nav .count { font: 400 13px var(--font-mono); color: var(--muted); margin: 0 auto; }

/* Method and findings: a reading section under the map */
.report { position: relative; background: var(--ink); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 88px calc(96px + env(safe-area-inset-bottom, 0px)); }
.report-inner { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 72px; }
.report-inner > *, .steps li > *, .finding > * { min-width: 0; }
.report h2 { margin: 0; font: 850 clamp(30px, 5vw, 56px)/1 var(--font-display); font-stretch: 125%; text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; }
.report .intro { margin: 20px 0 0; max-width: 64ch; font-size: 20px; line-height: 1.5; color: #d9d5cd; text-wrap: pretty; }
.report h3 { margin: 0 0 24px; font: 800 26px/1.15 var(--font-display); font-stretch: 112%; text-wrap: balance; }
.report p { margin: 0; max-width: 68ch; font-size: 17px; line-height: 1.6; color: #cfcbc3; text-wrap: pretty; }
.report p + p { margin-top: 14px; }
.report .num { font-family: var(--font-mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 48px; counter-reset: step; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 12px; align-content: start; }
.steps li::before { content: counter(step); grid-row: span 2; font: 400 14px var(--font-mono); color: var(--muted); padding-top: 4px; }
.steps h4 { margin: 0; font: 700 18px var(--font-body); }
.steps p { font-size: 16px; }
.finding { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px 56px; align-items: start; padding-top: 32px; border-top: 1px solid var(--line); }
.finding + .finding { margin-top: 40px; }
.finding h4 { margin: 0 0 12px; font: 700 20px/1.25 var(--font-body); text-wrap: balance; }
.finding .side { min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .legend-row { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.chart .legend-row span { display: inline-flex; align-items: center; gap: 8px; }
.chart .legend-row i { width: 12px; height: 12px; border-radius: 3px; }
.leads td:first-child { font-weight: 650; }
.leads td small { margin-top: 2px; }
.limits { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 48px; }
.limits li { font-size: 16px; line-height: 1.55; color: #cfcbc3; padding-left: 18px; position: relative; max-width: 60ch; }
.limits li::before { content: ""; position: absolute; left: 0; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
.limits b { color: var(--fg); }
.limits.checks li::before { background: var(--verified); }
.limits.refs { margin-top: 20px; }
.limits.refs li::before { background: var(--muted); }
.limits.refs a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }
.sub-h { margin: 0 0 16px; font: 700 17px var(--font-body); color: var(--muted); }
.limits + .sub-h { margin-top: 36px; }
.report footer { color: var(--muted); font-size: 14px; border-top: 1px solid var(--line); padding-top: 24px; }
.report footer p { margin: 0 0 6px; }

@media (max-width: 700px) {
  .sheet { top: auto; height: 78%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; transform: translateY(105%); }
  .sheet.open { transform: none; }
  .drawer { height: 100%; top: 0; bottom: 0; border-radius: 0; transform: translateX(-105%); }
  .entity-top { grid-template-columns: minmax(0, 1fr) 96px; }
  .crumbs { top: calc(84px + env(safe-area-inset-top, 0px)); }
  .tour-card { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .to-report span { display: none; }
}
@media (max-width: 860px) {
  .steps, .limits { grid-template-columns: minmax(0, 1fr); }
  .finding { grid-template-columns: minmax(0, 1fr); }
  .report { padding-block: 64px calc(72px + env(safe-area-inset-bottom, 0px)); }
  .report-inner { gap: 56px; }
}
@media (prefers-reduced-motion: reduce) {
  .sheet { transition: none; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>

<section class="stage" aria-label="Transfer map">
<div id="sky"></div>
<canvas id="stars" aria-hidden="true"></canvas>
<svg id="map" role="application" aria-label="Map of Polimi medtech patents, Italian startups and Polimi spin-offs. Use the search or the lists in the menu to reach every item by keyboard."></svg>

<header class="top">
  <button class="round" id="menuBtn" aria-label="Open the menu: views, filters, lists and sources" aria-controls="menu" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h9"/></svg>
  </button>
  <h1 class="brand">Transfer Map<small>Polimi medtech · Italian startups</small></h1>
  <button class="round" id="searchBtn" aria-label="Search a patent, startup or spin-off">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
  </button>
</header>

<nav class="crumbs" aria-label="Breadcrumb">
  <button class="pill" id="crumbMap"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6.5 1.5L3 5l3.5 3.5"/></svg>Map</button>
  <button class="pill light" id="crumbSel" hidden></button>
</nav>

<div class="tourbar">
  <button class="tour-start" id="tourBtn" aria-label="Start the data tour">
    <span class="play"><svg viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z"/></svg></span>
    <span id="tourLabel" style="font-weight:650">Data tour</span>

<script id="data" type="application/json">{"nodes":[{"id":"P:EP2526859A1","type":"patent","ref":"EP2526859A1","label":"Portable and wearable system for the acquisition, displaying,…","mt":false,"text":"The invention describes a system that allows the acquisition, for subsequent elaboration also through electronic and automatic systems, of the electrocardiographic signal of human subjects. The signal is acquired, preamplified, filtered, amplified, converted into digital form. The signal is stored and transmitted to a portable or fixed elaboration system for subsequent elaborations, analysis, comparison and further storage. The parameters for the acquisition, preamplification, filtering, amplification and conversion satisfy the recommendations of the regulatory bodies and the relevant Scientific Associations. The protocol for the transmission to a portable or fixed elaboration system is of…","ipc":"A61B","group":"A61B","ipcAll":"A61B","priority":"2011","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":false,"industry":"","best":null,"bestStartup":null},{"id":"P:JP2016039995A","type":"patent","ref":"JP2016039995A","label":"Blood processing unit with changed channel","mt":false,"text":"PROBLEM TO BE SOLVED: To provide a blood processing unit with a changed channel.SOLUTION: A blood processing apparatus can include a heat exchanger and a gas exchanger. At least one of the heat exchanger and the gas exchanger can be configured to impart a radial component to a blood flow passing through the heat exchanger and/or the gas exchanger. The heat exchanger can be configured to make the blood flow pass through a spiral channel.SELECTED DRAWING: Figure 1","ipc":"A61M","group":"A61M","ipcAll":"A61M","priority":"2015","applicants":"SORIN GROUP ITALIA SRL · MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"SORIN GROUP ITALIA SRL","best":0.4754,"bestStartup":"S:05309440260"},{"id":"P:JP2013063121A","type":"patent","ref":"JP2013063121A","label":"Blood processing unit with changed flow path","mt":false,"text":"PROBLEM TO BE SOLVED: To provide a blood processing unit with a changed flow path.SOLUTION: The blood processing apparatus may include a heat exchanger and a gas exchanger. At least one of the heat exchanger and/or the gas exchanger may be configured to provide a blood flow through the heat exchanger and/or gas exchanger with a radial component. The heat exchanger may be configured to cause the blood flow to follow a spiral flow path.","ipc":"A61M","group":"A61M","ipcAll":"A61M","priority":"2011","applicants":"SORIN GROUP ITALIA SRL · MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"SORIN GROUP ITALIA SRL","best":0.4893,"bestStartup":"S:05309440260"},{"id":"P:JP2011229917A","type":"patent","ref":"JP2011229917A","label":"Oxygenator with integrated arterial filter","mt":false,"text":"An oxygenator (10) combines, in a single structure, a heat exchanger (32), a gas exchanger (34) and an arterial filter (38). Such an oxygenator permits fewer fluid connections and thus may simplify an extracorporeal blood circuit, including a heart-lung machine and a blood reservoir, in which it is used. In some cases, the oxygenator (10) may be configured to include multiple purge ports (28, 30) for purging bubbles both before and after filtering the blood.","ipc":"A61M","group":"A61M","ipcAll":"A61M","priority":"2010","applicants":"SORIN GROUP ITALIA SRL · MILANO POLITECNICO","titleOnly":false,"orphan":false,"industry":"","best":null,"bestStartup":null},{"id":"P:WO2018050632A1","type":"patent","ref":"WO2018050632A1","label":"Rehabilitation apparatus for upper limb","mt":false,"text":"A rehabilitation apparatus for an upper limb of a patient is described, the apparatus comprising an electrostimulator element and a sensor element, both wearable by the patient. The electrostimulator element comprises a brace, configured to be positioned on the limb of the patient, and an electronic module comprising connectors for electrodes suitable for providing electrical stimulation to the patient's limb. The sensor element comprises a flex sensor configured to measure a movement of at least one portion of another upper limb of the patient. The electronic module is configured to connect wirelessly to the sensor element to receive from it a signal generated by the flex sensor depending…","ipc":"A61N","group":"A61N","ipcAll":"A61N","priority":"2016","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":false,"industry":"","best":null,"bestStartup":null},{"id":"P:US2001053881A1","type":"patent","ref":"US2001053881A1","label":"System and method for the automatic evaluation of the indexes of…","mt":false,"text":"The present invention refers to a system and a method for the automatic evaluation of the indexes of volemic status (Systolic Pressure Variation or SPV) in patients submitted to mechanic ventilation, starting form the analysis of the variations of the values of blood pressure. In one embodiment the system for the automatic evaluation of indexes of volemic status of a patient comprises: means suitable for submitting said patient to a preset period of apnoea and to a preset period of mechanical breathing; heart pressure probes for acquiring an analogical signal relative to the values of the blood pressure of said patient in said preset periods; an analogue/digital converter for the…","ipc":"A61B","group":"A61B","ipcAll":"A61B · A61M","priority":"2000","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.5249,"bestStartup":"S:14159910968"},{"id":"P:EP1358859A1","type":"patent","ref":"EP1358859A1","label":"Bone prostheses having multilayer interface","mt":false,"text":"A bone prosthesis has a portion of interface with the bone which comprises a porous layer (2) with cavities (3, 4) having prefixed and reproducible dimensions and arrangement, and at least an osteoinductive layer containing one or more chemical compounds that can stimulate and promote the growth of bone tissue. <IMAGE>","ipc":"A61C","group":"A61F","ipcAll":"A61C · A61F · A61L","priority":"2002","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":false,"industry":"","best":null,"bestStartup":null},{"id":"P:IT202000009016A1","type":"patent","ref":"IT202000009016A1","label":"Device for the treatment of postpartum uterine haemorrhages","mt":true,"text":"It forms of the present invention a device (1) for intrauterine insertion which includes: • - an expandable balloon (19) having a proximal end (20) and a distal end (21), sized to fill the uterine cavity during expansion and to exert pressure against its boundary wall on substantially the total surface of said wall; • - a catheter (13) having a proximal end (22) and a distal end (23), where said distal end (23) of said catheter is connected with the proximal end (20) of said balloon (19), and said proximal end (22) of said catheter is connected to a source of fluid and means (26) for supplying pressurized fluid to the balloon (19) through said catheter to effect and maintain its expanded…","ipc":"A61M","group":"A61M","ipcAll":"A61M","priority":"2020","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.4863,"bestStartup":"S:02802400222"},{"id":"P:WO2018215930A1","type":"patent","ref":"WO2018215930A1","label":"Wearable device to manage an epileptic seizure of a person","mt":false,"text":"Device for managing the epileptic seizure of a first person subjected to epileptic seizures, by a second person, wherein said device is worn by said second person and comprising: means for manually activating said device; alert means for providing information related to the time remaining to reach a pre-set time; means for deactivating said device; storing means for storing the start time of the seizure and the duration thereof; transmission means for sending the start time of the seizure and the duration thereof to a digital application; a control circuit which controls said alerting means.","ipc":"A61B","group":"A61B","ipcAll":"A61B","priority":"2017","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.5008,"bestStartup":"S:02538050507"},{"id":"P:WO2023275816A1","type":"patent","ref":"WO2023275816A1","label":"Method and system of assisting the execution of physical exercises","mt":false,"text":"The present invention relates to a method (100) of assisting the performance of physical exercises. The method (100) comprises the steps of: by means of a wearable electronic device (2) provided with a plurality of inertial sensors (13) worn by a user, acquiring (101 ) measures of a set of three movement components transverse to each other, each parallel to an axis of a Euclidean reference system; determining (105-109) whether there is a main movement component of said set of three, i.e. a movement component substantially greater than the other movement components; if so, comparing the set of three movement components with a set of set of threes of reference movement components to identify…","ipc":"A61B","group":"A61B","ipcAll":"A61B · G06N · G16H","priority":"2021","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.5031,"bestStartup":"S:02430800504"},{"id":"P:US2014300867A1","type":"patent","ref":"US2014300867A1","label":"Device for monitoring position and movements of an eye, particularly…","mt":false,"text":"The present invention is about a device for non-invasive monitoring of an eye position and ocular movements of a patient, comprising: - a housing body (2) having at least one through opening (2a); - a plurality of light sources (3) housed in said housing body (2); - a plurality of sensor means (4) housed in said housing body (2); - deflector means (6) for invisible radiation (RL) supplied, in use, by said plurality of light sources (3) and reflected by said eye (O) under examination; - support means (8) that can be adjusted for said housing body (2); - at least one progr esion of an internal tissue, for example a cartilage tissue of an articulation of the knee.","ipc":"A61B","group":"A61B","ipcAll":"A61B · A61F","priority":"2004","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.5289,"bestStartup":"S:10907181217"},{"id":"P:EP1453566A1","type":"patent","ref":"EP1453566A1","label":"Aortic cannula","mt":false,"text":"The present invention refers to a cannula, in particular aortic. In an embodiment the aortic cannula comprises a tubular tip (1), suitable to be inserted into an aorta, characterised in that said tubular tip (1) comprises at least a first circumferential portion, made up of deformable material (3), and at least a second circumferential portion, made up of non deformable material (2), that extend longitudinally starting from the final end of said tubular tip (1), said second circumferential portion (2) being placed adjacent to the aorta wall, on the same side of the surgically made slit, through which the tubular tip (1) is inserted in the aorta, so that, while a first fluid is introduced…","ipc":"A61M","group":"A61M","ipcAll":"A61M","priority":"2001","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.4598,"bestStartup":"S:02458350564"},{"id":"P:IT202200025794A1","type":"patent","ref":"IT202200025794A1","label":"Device and kit for the treatment of bone fractures","mt":true,"text":"Described herein is a guide wire (200) made of metal material, the guide wire (200) comprising a filiform body (210) having a first end and a second end; the filiform body (210) comprises a plurality of passages (211, 212, 213) formed in the volume of the filiform body (210); each passage (211, 212, 213) is a through aperture that extends throughout the length of the filiform body (210) wherein a vision element (250) is housed in a respective passage (211).","ipc":"A61B","group":"A61B","ipcAll":"A61B","priority":"2022","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.3446,"bestStartup":"S:02713140065"},{"id":"P:US2009272381A1","type":"patent","ref":"US2009272381A1","label":"Apparatus for respiratory support and non-invasive detection of…","mt":false,"text":"There is described an apparatus (1) for respiratory support and non- invasive detection of alveolar derecruitment for patients suffering from respiratory failure. Such an apparatus (1) generally comprises a mechanical ventilator (3) for inspiration/expiration functions and means (15) allowing to impose an additional periodic pressure component (Pstim) having a higher frequency than the spectral content of the inspiration/expiration pressure component (Presp). There are provided computing means (12) to obtain the inspiratory average reactance (Xrs) of the respiratory system of the patient (2) as the positive end-expiratory pressure (PEEP) varies, in order to detect the presence of alveolar…","ipc":"A61B","group":"A61B","ipcAll":"A61B · A61M · A62B · F16K","priority":"2006","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.4472,"bestStartup":"S:07566000480"},{"id":"P:IT202300016464A1","type":"patent","ref":"IT202300016464A1","label":"Wearable support device","mt":true,"text":"A wearable support device comprising at least one columnar support element (11) with a plurality of modules (100, 200, 300) connected in column. At least one module (100) comprises: a first base element (101) and a second base element (102) juxtaposed and connected to each other, and a first connecting element (103); the first base element and the second base element comprise a second connecting element (104) configured to allow at least a transverse rotation; the first connecting element comprises a first end (103a) constrained to the first base element and a second end (103b) housable in an adjacent second module (200); the first connecting element is further configured to allow at least…","ipc":"A61F","group":"A61F","ipcAll":"A61 s: • - an expandable balloon (19) having a proximal end (20) and a distal end (21), sized to fill the uterine cavity during expansion and to exert pressure against its boundary wall on substantially the total surface of said wall; • - a catheter (13) having a proximal end (22) and a distal end (23), where said distal end (23) of said catheter is connected with the proximal end (20) of said balloon (19), and said proximal end (22) of said catheter is connected to a source of fluid and means (26) for supplying pressurized fluid to the balloon (19) through said catheter to effect and maintain its expanded…","ipc":"A61B","group":"A61B","ipcAll":"A61B · A61M","priority":"2020","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.4863,"bestStartup":"S:02802400222"},{"id":"P:US2014154212A1","type":"patent","ref":"US2014154212A1","label":"Crosslinked gelatin hydrogels","mt":false,"text":"Hydrogels based on gelatin crosslinked with N,N'-methylenebisacrylamide (MBA) are disclosed. The hydrogels according to the invention are useful for cell culture, growth and proliferation, for the controlled release of bioactive molecules, and to promote tissue regeneration.","ipc":"A61K","group":"A61L","ipcAll":"A61K · A61L","priority":"2011","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":false,"industry":"","best":null,"bestStartup":null},{"id":"P:US2015157187A1","type":"patent","ref":"US2015157187A1","label":"Endoscope","mt":false,"text":"The endoscope comprises an optical focusing and zooming device (3), motion imparting members (4) operable on the optical device (2), transducer members (5) located downstream from the optical device (3) and designed to convert an optical flow into an electric signal, lighting members (6). A control and monitoring unit (8) receives signals representative of optical zoom degrees and is connected to the motion imparting members (4) to actuate the latter. The optical device (3) comprises a first set of lenses (8), a second set of lenses (9) adapted to be moved by the motion imparting members (4) for changing the optical zoom, a third set of lenses (10) adapted to be moved by the motion…","ipc":"A61B","group":"A61B","ipcAll":"A61B","priority":"2012","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.4634,"bestStartup":"S:11510580969"},{"id":"P:US2005178385A1","type":"patent","ref":"US2005178385A1","label":"System and method for the automatic detection of the expiratory flow…","mt":false,"text":"The present invention refers to a system and a method for the automatic detection of the expiratory flow limitation of a subject. In an embodiment thereof the system for the automatic detection of expiratory flow limitation of a subject comprises: means for determining the respiratory impedance of said subject composed of an imaginary component and, eventually, of a real part or, at least, means to apply a forcing signal with one or more spectral components to the airway opening of a subject combined with means to measure time courses of pressure and flow at the airway opening; means for determining at least one index linked to said respiratory impedance or pressure and flow time courses;…","ipc":"A61B","group":"A61B","ipcAll":"A61B · A61M · A62B","priority":"2002","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.4604,"bestStartup":"S:14159910968"},{"id":"P:US12397096B2","type":"patent","ref":"US12397096B2","label":"Red blood cells for drug delivery","mt":false,"text":"It is an object of the present invention a method to introduce compounds inside red blood cells comprising: - providing red blood cells from a subject; - providing one or more compounds to be encapsulated in said red blood cells; - providing a loading device comprising a microporous matrix; - feeding said loading device with a suspension comprising said red blood cells and said one or more compounds; - collecting the red blood cells exiting from said loading device, which are encapsulated red blood cells; characterized in that: - said red blood cells and said one or more compound are in suspension at a pH of between 6.8 and 7.8, preferably of between 7.35 and 7.45; - the pores in said…","ipc":"A01N","group":"A61M","ipcAll":"A01N · A61M · C12N","priority":"2019","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":false,"industry":"","best":null,"bestStartup":null},{"id":"P:EP2000085A2","type":"patent","ref":"EP2000085A2","label":"Portable electrocardiographic apparatus","mt":false,"text":"A portable apparatus for measuring and storing an electric signal relative to an electrocardiographic trace comprising electrode means (3, 4) for interfacing portions of the body of a user to detect an electric signal relative to an electrocardiographic trace of the latter, processing means (5) for acquiring said electric signal by said electrode means (3, 4) and memory means (6) for storing said electric signal acquired by said processing means (5), said memory means (6) being removable.","ipc":"A61B","group":"A61B","ipcAll":"A61B","priority":"2007","applicants":"MILANO POLITECNICO","titleOnly":false,"orphan":true,"industry":"","best":0.4409,"bestStartup":"S:04006031209"},{"id":"P:EP1715823A1","type":"patent","ref":"EP1715823A1","label":"A method and apparatus for generating a control signal as a function…","mt":false,"text":"The present invention relates to an apparatus for generating a control signal for an electrical/electronic peripheral as a function of a respiratory flow of a subject (3) the operating principle of which is based on the acquisition of a signal produced by the subject (3) by means of the respiratory flow which can easily be modulated using the facial and nasal muscles. Modulation of the flow in terms of duration of the individual outward flows even within the same respiratory act may encode a series of commands such as letters or functions by using transducer means (2) which detect the
