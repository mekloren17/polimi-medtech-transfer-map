# Polimi MedTech Transfer Map — scope, thresholds and model.
# Every output records the values used here.

patents:
  # IPC subclasses defining the medtech scope
  ipc_classes: [A61B, A61F, A61L, A61M, A61N, G16H]

startups:
  # Regions to keep, named as in the InfoCamere register (e.g. [Lombardia]).
  # An empty list keeps the whole of Italy.
  regions: []
  # ATECO 2007 classes kept regardless of description
  ateco_codes: ["32.50", "26.60"]
  # ATECO divisions (first two digits) where medtech companies plausibly register
  # beyond the explicit classes above: chemistry/pharma, plastics, electronics, electrical
  # equipment, machinery, medical manufacturing, software, information services,
  # engineering, R&D, other technical activities, healthcare. Only these "candidates"
  # get their website description collected (src/collect/websites.py).
  candidate_ateco_divisions: ["20", "21", "22", "26", "27", "28", "32", "33",
                              "62", "63", "71", "72", "74", "86"]
  websites:
    user_agent: "PolimiMedTechTransferMap/0.1 (open research project; homepage text only)"
    timeout_s: 10
    workers: 24
    # Characters of visible text kept when a page has no meta description
    max_text_chars: 600
  # Case-insensitive word prefixes: each keyword must start a word ("stent" does not
  # match "assistente"). Italian and English, since descriptions mix both. Keep entries
  # specific: generic words ("salute", "health", "benessere", "impianti") let in too many
  # unrelated companies.
  keywords:
    # devices and clinical practice
    - dispositivo medico
    - dispositivi medici
    - medical device
    - medtech
    - biomedic
    - chirurg
    - surgical
    - surgery
    - protesi
    - prosthe
    - ortesi
    - impiantabil
    - impianto dentale
    - impianti dentali
    - implant
    - catetere
    - catheter
    - stent
    - cardiovascolar
    - cardiac
    - cardiolog
    - ortoped
    - orthop
    - riabilitazion
    - rehabilitation
    - neurolog
    - oncolog
    - diagnos
    - imaging medic
    - medical imaging
    - ecograf
    - ultrasound
    - risonanza magnetica
    - endoscop
    - paziente
    - pazienti
    - patient
    - clinic
    - ospedal
    - hospitals
    - terapi
    - therap
    # digital health
    - telemedicin
    - digital health
    - sanità digitale
    - e-health
    - dispositivi indossabili
    - wearable
    - monitoraggio dei parametri vitali
    - vital sign
    # materials and bioengineering
    - biomateriali
    - biomaterial
    - bioingegneria
    - bioengineering
    - ingegneria tissutale
    - tissue engineering
    - medicina rigenerativa
    - regenerative medicine
    - bioprint
    - organ-on-chip
    - organ on chip

embedding:
  # Multilingual: startup descriptions are mostly Italian, patent abstracts mostly English.
  # Compared with BAAI/bge-m3 on data/manual/calibration_pairs.csv: bge-m3 has no language
  # bias but ranks the labelled pairs worse (AUC 0.72 vs 0.89), so this model is kept.
  model: sentence-transformers/paraphrase-multilingual-mpnet-base-v2

similarity:
  # Best F1 on the calibration pairs (src/score/calibrate.py report): about 0.57 precision,
  # 0.80 recall. Labels drafted by Claude with a reason per pair; still to be checked by the author.
  threshold: 0.55
  # A link also needs the startup to be among the patent's closest N: a patent with a very
  # broad description (e.g. a generic digital-health method) otherwise links to dozens
  # of startups on shared vocabulary alone.
  max_links_per_patent: 5

site:
  # Public GitHub repository linked from the "Reproduce it" section of the site.
  # Leave empty until the repository is published.
  repo_url: ""
