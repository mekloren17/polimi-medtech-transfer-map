<title>Polimi MedTech Transfer Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-screen night map of technology families; chrome floats at the edges
   (menu, title, search on top; breadcrumb under it; tour bar at the bottom; entity sheet on demand). */
:root {
  color-scheme: dark;
  --ink: #0b0b0c;
  --ink-2: #141416;
  --ink-3: #1d1d21;
  --paper: #f2efe8;
  --fg: #f4f2ee;
  --muted: #9b978f;
  --line: rgba(244, 242, 238, 0.14);
  --glow: #8e1414;
  --red: #ff3b30;
  --verified: #34d27b;
  --patent: #5fd3e6;
  --startup: #ffb23e;
  --spinoff: #b38cff;
  --font-display: "Archivo", "Arial Black", system-ui, sans-serif;
  --font-body: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--fg); overflow: hidden;
  font: 15px/1.5 var(--font-body);
}
button { font: inherit; color: inherit; }
a { color: inherit; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.caps { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px; }

/* Sky */
#sky { position: fixed; inset: 0; background:
  radial-gradient(120% 90% at 100% 100%, var(--glow) 0%, rgba(142, 20, 20, 0.35) 32%, transparent 62%),
  radial-gradient(60% 50% at 0% 0%, #17171a 0%, transparent 70%), var(--ink); }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#map:active { cursor: grabbing; }

/* Top chrome */
.top {
  position: fixed; inset: 0 0 auto; z-index: 20; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center; gap: 12px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; background: linear-gradient(var(--ink) 0%, rgba(11, 11, 12, 0) 100%);
}
.top > * { pointer-events: auto; }
.round {
  width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: rgba(20, 20, 22, 0.8);
  display: grid; place-items: center; cursor: pointer;
}
.round:hover, .round:focus-visible { border-color: var(--fg); outline: none; }
.round svg { width: 18px; height: 18px; stroke: var(--fg); fill: none; stroke-width: 1.8; }
h1.brand {
  margin: 0; text-align: center; font-family: var(--font-display); font-weight: 850; font-stretch: 125%;
  font-size: clamp(18px, 3.4vw, 34px); letter-spacing: 0.02em; text-transform: uppercase; line-height: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
}
h1.brand small { display: block; font: 500 11px var(--font-mono); letter-spacing: 0.18em; color: var(--muted); margin-top: 8px; }
.crumbs { position: fixed; z-index: 19; left: 50%; transform: translateX(-50%); top: calc(96px + env(safe-area-inset-top, 0px)); display: flex; gap: 8px; max-width: calc(100% - 32px); }
.pill {
  border: 1px solid var(--line); background: rgba(20, 20, 22, 0.85); border-radius: 999px; padding: 6px 14px;
  cursor: pointer; white-space: nowrap; max-width: 60vw; overflow: hidden; text-overflow: ellipsis;
}
.pill.light { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.pill:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* Map marks */
.cluster-label { pointer-events: none; text-anchor: middle; }
.cluster-label .name { font: 700 13px var(--font-display); font-stretch: 112%; letter-spacing: 0.12em; fill: var(--fg); text-transform: uppercase; paint-order: stroke; stroke: var(--ink); stroke-width: 4px; }
.cluster-label .stat { font: 400 11px var(--font-mono); fill: var(--muted); paint-order: stroke; stroke: var(--ink); stroke-width: 4px; }
.node { cursor: pointer; }
.node .label { font: 600 12px var(--font-body); fill: var(--fg); paint-order: stroke; stroke: var(--ink); stroke-width: 3.5px; pointer-events: none; }
.faded { opacity: 0.12; }
.reticle { pointer-events: none; }
.reticle circle { fill: none; stroke: rgba(244, 242, 238, 0.55); stroke-width: 1; }
.reticle path { fill: none; stroke: var(--fg); stroke-width: 1.6; }

/* Bottom chrome */
.view-toggle {
  position: fixed; z-index: 18; left: 50%; transform: translateX(-50%);
  bottom: calc(86px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 4px;
  border: 1px solid var(--line); border-radius: 999px; background: rgba(14, 14, 16, 0.9);
}
.view-toggle button {
  border: 0; background: transparent; border-radius: 999px; padding: 8px 18px; cursor: pointer;
  font: 500 13px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; display: inline-flex; gap: 8px; align-items: center;
}
.view-toggle button[aria-checked="true"] { background: var(--paper); color: var(--ink); }
.view-toggle button:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
.tourbar {
  position: fixed; z-index: 18; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(14, 14, 16, 0.92); padding: 6px; overflow: hidden;
}
.tour-start { flex: none; display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 4px; background: transparent; cursor: pointer; }
.tour-start .play { width: 30px; height: 30px; border-radius: 50%; background: var(--red); display: grid; place-items: center; }
.tour-start .play svg { width: 12px; height: 12px; fill: var(--fg); }
.tour-start:focus-visible { outline: 2px solid var(--fg); }
.ticker { flex: 1; min-width: 0; overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.ticker-track { display: inline-flex; gap: 28px; white-space: nowrap; animation: tick 70s linear infinite; padding-left: 20px; }
.ticker:hover .ticker-track, .ticker:focus-within .ticker-track { animation-play-state: paused; }
.ticker button { border: 0; background: transparent; cursor: pointer; padding: 6px 0; font-size: 14px; color: var(--muted); }
.ticker button b { color: var(--red); font: 600 13px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; margin-right: 8px; }
.ticker button:hover, .ticker button:focus-visible { color: var(--fg); outline: none; }
@keyframes tick { to { transform: translateX(-50%); } }

/* Sheets */
.sheet {
  position: fixed; z-index: 30; right: 0; top: 0; bottom: 0; width: min(560px, 100%);
  background: var(--ink-2); border-left: 1px solid var(--line); display: flex; flex-direction: column;
  transform: translateX(105%); transition: transform 0.35s cubic-bezier(.2,.7,.2,1); box-shadow: -30px 0 60px rgba(0, 0, 0, 0.45);
  visibility: hidden;
}
.sheet.open { transform: none; visibility: visible; }
.sheet-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line);
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
}
.sheet-head .caps { display: inline-flex; align-items: center; gap: 10px; }
.dotmark { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.close { border: 0; background: transparent; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; }
.close:hover, .close:focus-visible { background: var(--ink-3); outline: none; }
.close svg { width: 16px; height: 16px; stroke: var(--fg); stroke-width: 2; }
.sheet-body { overflow-y: auto; padding: 24px 20px calc(32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 20px; align-content: start; }
.entity-top { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 18px; align-items: start; }
.code { font: 500 13px var(--font-mono); letter-spacing: 0.06em; display: inline-flex; gap: 8px; align-items: center; overflow-wrap: anywhere; }
.entity-name { margin: 6px 0 12px; font: 850 clamp(28px, 4.4vw, 44px)/1.02 var(--font-display); font-stretch: 105%; letter-spacing: -0.01em; overflow-wrap: anywhere; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font: 500 12px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; }
.tldr { border-left: 3px solid var(--red); padding: 2px 0 2px 16px; display: grid; gap: 6px; }
.tldr p { margin: 0; font-size: 18px; line-height: 1.45; }
.tldr span { color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; background: transparent; cursor: pointer; text-decoration: none; font: 500 12px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; }
.btn:hover, .btn:focus-visible { border-color: var(--fg); outline: none; }
.btn:disabled { opacity: 0.4; cursor: default; }
.section-title { color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.facts dt { color: var(--muted); font: 500 12px var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; padding-top: 2px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.prose { color: #cfcbc3; margin: 0; max-width: 62ch; }
.note { color: var(--muted); font-size: 13px; margin: 0; }
.links { display: grid; gap: 8px; }
.link-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--ink-3); cursor: pointer; text-align: left; width: 100%;
}
.link-row:hover, .link-row:focus-visible { border-color: rgba(244, 242, 238, 0.45); outline: none; }
.link-row .who { font-weight: 650; overflow-wrap: anywhere; }
.link-row .score { font: 500 13px var(--font-mono); }
.link-row .why { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
.meter { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--fg); }

/* Dossier card */
.dossier {
  position: relative; background: var(--paper); color: var(--ink); padding: 14px 12px 12px; border-radius: 3px;
  transform: rotate(3deg); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); font-family: var(--font-mono);
}
.dossier .clip { position: absolute; top: -16px; left: 22px; width: 14px; height: 40px; border: 2px solid #8c8a86; border-radius: 8px; border-bottom-color: transparent; }
.dossier .head { display: flex; justify-content: space-between; gap: 6px; font-size: 9px; letter-spacing: 0.12em; color: #6b675f; }
.dossier svg { display: block; width: 100%; aspect-ratio: 1 / 1.1; margin: 8px 0; background: #1a0f10; border-radius: 2px; }
.dossier .who { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; overflow-wrap: anywhere; }
.dossier .sub { font-size: 10px; color: #6b675f; }
.stamp {
  position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) rotate(-12deg);
  border: 2px solid var(--red); color: var(--red); padding: 2px 8px; font: 700 12px var(--font-mono); letter-spacing: 0.18em; white-space: nowrap; background: rgba(26, 15, 16, 0.6);
}
.stamp.ok { border-color: var(--verified); color: var(--verified); }

/* Menu drawer */
.drawer { right: auto; left: 0; border-left: 0; border-right: 1px solid var(--line); width: min(440px, 100%); transform: translateX(-105%); }
.menu-group { display: grid; gap: 10px; }
.menu-group h2 { margin: 0; font: 500 12px var(--font-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.option { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; text-align: left; width: 100%; }
.option[aria-pressed="true"] { border-color: var(--fg); background: var(--ink-3); }
.option:focus-visible { outline: 2px solid var(--fg); }
.option small { color: var(--muted); font-family: var(--font-mono); }
.range { display: grid; gap: 6px; }
.range input { width: 100%; accent-color: var(--red); }
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--red); }
.legend { display: grid; gap: 8px; font-size: 14px; }
.legend span { display: flex; align-items: center; gap: 10px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.legend i.line { height: 0; width: 20px; border-radius: 0; border-top: 2px solid; }

/* Lists */
.table-wrap { overflow: auto; max-height: 360px; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 500 11px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--ink-2); }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; }
tbody tr:hover td, tbody tr:focus-visible td { background: var(--ink-3); }
tbody tr:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
td.num { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
td small { display: block; color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }

/* Search */
.search { position: fixed; z-index: 40; inset: 0; background: rgba(8, 8, 9, 0.86); display: grid; align-content: start; justify-items: center; padding: calc(90px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.search-box { width: min(620px, 100%); display: grid; gap: 10px; }
.search input { width: 100%; padding: 16px 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--ink-2); color: var(--fg); font: 500 18px var(--font-body); }
.search input:focus { outline: none; border-color: var(--fg); }
.results { display: grid; gap: 4px; max-height: 60vh; overflow-y: auto; }
.result { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; border: 1px solid transparent; background: transparent; cursor: pointer; text-align: left; width: 100%; }
.result:hover, .result.active, .result:focus-visible { background: var(--ink-3); border-color: var(--line); outline: none; }
.result span:last-child { color: var(--muted); font-family: var(--font-mono); font-size: 12px; margin-left: auto; white-space: nowrap; }

/* Tour card and agent view */
.tour-card {
  position: fixed; z-index: 25; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(140px + env(safe-area-inset-bottom, 0px));
  width: min(420px, calc(100% - 32px)); background: var(--ink-2); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}
.tour-card h2 { margin: 0; font: 850 24px/1.1 var(--font-display); font-stretch: 110%; text-wrap: balance; }
.tour-card p { margin: 0; color: #cfcbc3; }
.tour-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.agent { display: grid; gap: 12px; }
.agent pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 400 12.5px/1.55 var(--font-mono); color: #d9d5cd; background: var(--ink-3); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }

@media (max-width: 700px) {
  .sheet { top: auto; height: 78%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; transform: translateY(105%); }
  .sheet.open { transform: none; }
  .drawer { height: 100%; top: 0; bottom: 0; border-radius: 0; transform: translateX(-105%); }
  .entity-top { grid-template-columns: minmax(0, 1fr) 110px; }
  .crumbs { top: calc(84px + env(safe-area-inset-top, 0px)); }
  .view-toggle { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .view-toggle button { padding: 7px 12px; }
  .tour-card { bottom: calc(132px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .ticker-track { animation: none; }
  .sheet { transition: none; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<!--/HEAD-->
<div id="sky"></div>
<canvas id="stars" aria-hidden="true"></canvas>
<svg id="map" role="application" aria-label="Map of Polimi medtech patents, Lombard startups and Polimi spin-offs. Use the search or the lists in the menu to reach every item by keyboard."></svg>

<header class="top">
  <button class="round" id="menuBtn" aria-label="Open the menu: views, filters, lists and sources" aria-controls="menu" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h9"/></svg>
  </button>
  <h1 class="brand">Transfer Map<small>Polimi medtech · Lombard startups</small></h1>
  <button class="round" id="searchBtn" aria-label="Search a patent, startup or spin-off">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>
  </button>
</header>

<nav class="crumbs" aria-label="Breadcrumb">
  <button class="pill caps" id="crumbMap">◂ Map</button>
  <button class="pill light" id="crumbSel" hidden></button>
</nav>

<div class="view-toggle" role="radiogroup" aria-label="View">
  <button role="radio" aria-checked="true" id="humanBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>Human</button>
  <button role="radio" aria-checked="false" id="agentBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l5 5-5 5M12 18h8"/></svg>Agent</button>
</div>

<div class="tourbar">
  <button class="tour-start" id="tourBtn" aria-label="Start the data tour">
    <span class="play"><svg viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z"/></svg></span>
    <span class="caps" id="tourLabel">Data tour</span>
  </button>
  <div class="ticker" aria-label="Key facts"><div class="ticker-track" id="ticker"></div></div>
</div>

<aside class="sheet" id="sheet" aria-labelledby="sheetKind" aria-hidden="true">
  <div class="sheet-head">
    <span class="caps" id="sheetKind"></span>
    <button class="close" id="sheetClose" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</aside>

<aside class="sheet drawer" id="menu" aria-label="Menu" aria-hidden="true">
  <div class="sheet-head">
    <span class="caps">Menu</span>
    <button class="close" id="menuClose" aria-label="Close the menu"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
  </div>
  <div class="sheet-body" id="menuBody"></div>
</aside>

<div class="search" id="search" hidden>
  <div class="search-box" role="dialog" aria-label="Search">
    <label class="caps" for="q" style="color:var(--muted)">Search a patent, startup or spin-off</label>
    <input id="q" type="search" autocomplete="off" placeholder="e.g. prosthesis, Pionirs, EP2526859">
    <div class="results" id="results" role="listbox"></div>
  </div>
</div>

<div class="tour-card" id="tourCard" hidden aria-live="polite"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const M = DATA.meta;
  const byId = new Map(DATA.nodes.map(n => [n.id, n]));
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = v => v == null ? "–" : v.toFixed(3);
  const trim = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COLORS = { patent: "#5fd3e6", startup: "#ffb23e", spinoff: "#b38cff", red: "#ff3b30", verified: "#34d27b" };
  const FAMILIES = {
    A61B: "Diagnosis & surgery", A61M: "Drug delivery & extracorporeal", A61F: "Prostheses & implants",
    A61L: "Biomaterials", A61N: "Electro & radiation therapy", G16H: "Health informatics",
  };
  const state = { min: M.threshold, hideLow: false, view: "all", selected: null, agent: false, highlight: null };

  // ---------- links ----------
  const allLinks = DATA.links;
  function activeLinks() {
    return allLinks.filter(l => l.kind === "known" || (l.score >= state.min - 1e-9 && !(state.hideLow && l.low)));
  }
  function linksOf(id, list = activeLinks()) {
    return list.filter(l => l.source === id || l.target === id)
      .sort((a, b) => (b.kind === "known") - (a.kind === "known") || (b.score || 0) - (a.score || 0));
  }

  // ---------- stars ----------
  const stars = document.getElementById("stars");
  function drawStars() {
    const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
    stars.width = w * dpr; stars.height = h * dpr;
    const c = stars.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < Math.round(w * h / 4200); i++) {
      const r = rnd();
      c.fillStyle = r > 0.97 ? "rgba(255,59,48,0.8)" : r > 0.93 ? "rgba(255,178,62,0.7)" : `rgba(244,242,238,${0.15 + rnd() * 0.45})`;
      const s = rnd() > 0.9 ? 2 : 1;
      c.fillRect(rnd() * w, rnd() * h, s, s);
    }
    c.strokeStyle = "rgba(244,242,238,0.22)"; c.lineWidth = 1;
    for (let x = 64; x < w; x += 128) for (let y = 96; y < h; y += 128) {
      if (rnd() > 0.55) continue;
      c.beginPath(); c.moveTo(x - 5, y); c.lineTo(x + 5, y); c.moveTo(x, y - 5); c.lineTo(x, y + 5); c.stroke();
    }
  }

  // ---------- layout ----------
  const svg = d3.select("#map");
  const world = svg.append("g");
  const linkLayer = world.append("g");
  const labelLayer = world.append("g");
  const nodeLayer = world.append("g");
  const reticle = world.append("g").attr("class", "reticle").attr("opacity", 0);
  reticle.append("circle").attr("r", 26);
  reticle.append("path").attr("d", "M-11,-5 v-6 h6 M5,-11 h6 v6 M11,5 v6 h-6 M-5,11 h-6 v-6");
  const zoom = d3.zoom().scaleExtent([0.4, 6]).on("zoom", e => { world.attr("transform", e.transform); updateLabels(e.transform.k); });
  svg.call(zoom).on("dblclick.zoom", null);
  svg.on("click", e => { if (e.target === svg.node()) select(null); });

  let W = innerWidth, H = innerHeight, home_t = d3.zoomIdentity;
  const centers = {};
  const nodes = DATA.nodes.map(n => ({ ...n }));
  const nodeById = new Map(nodes.map(n => [n.id, n]));
  const simLinks = allLinks.map(l => ({ ...l }));
  const degree = new Map();
  allLinks.forEach(l => { degree.set(l.source, (degree.get(l.source) || 0) + 1); degree.set(l.target, (degree.get(l.target) || 0) + 1); });

  function home(n) {
    if (n.type === "patent") return n.group in FAMILIES ? n.group : "A61B";
    if (n.type === "spinoff") return "SPINOFF";
    return "STARTUP";
  }

  function layout() {
    W = innerWidth; H = innerHeight;
    const cx = W / 2, cy = H / 2, rx = Math.max(200, Math.min(W * 0.32, 500)), ry = Math.max(170, Math.min(H * 0.26, 290));
    const fams = Object.keys(FAMILIES);
    fams.forEach((f, i) => {
      const a = -Math.PI / 2 + (i * 2 * Math.PI) / fams.length;
      centers[f] = { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) };
    });
    centers.STARTUP = { x: cx, y: cy + 10 };
    centers.SPINOFF = { x: cx + rx * 1.1, y: cy - ry * 1.05 };
    nodes.forEach(n => {
      n.deg = degree.get(n.id) || 0;
      n.r = n.type === "patent" ? 4 + Math.min(n.deg, 4) * 1.2 : n.type === "spinoff" ? 5 : 3.5 + Math.min(n.deg, 4) * 1.4;
      const c = centers[home(n)];
      let seed = [...n.id].reduce((s, ch) => (s * 31 + ch.charCodeAt(0)) % 9973, 7);
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      n.x = c.x + (rnd() - 0.5) * 80; n.y = c.y + (rnd() - 0.5) * 80;
    });
    const sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(simLinks).id(d => d.id).distance(l => l.kind === "known" ? 22 : 34).strength(l => l.kind === "known" ? 0.5 : 0.25))
      .force("charge", d3.forceManyBody().strength(-14))
      .force("x", d3.forceX(n => centers[home(n)].x).strength(n => n.type === "startup" && n.deg ? 0.01 : 0.16))
      .force("y", d3.forceY(n => centers[home(n)].y).strength(n => n.type === "startup" && n.deg ? 0.01 : 0.16))
      .force("collide", d3.forceCollide(n => n.r + 2.5))
      .stop();
    for (let i = 0; i < 420; i++) sim.tick();
    svg.attr("viewBox", [0, 0, W, H]);
    // Home view: fit every dot between the top chrome and the bottom bars
    const x0 = d3.min(nodes, n => n.x) - 90, x1 = d3.max(nodes, n => n.x) + 90;
    const y0 = d3.min(nodes, n => n.y) - 40, y1 = d3.max(nodes, n => n.y) + 40;
    const top = 120, bottom = 150, k = Math.min(1, (W - 32) / (x1 - x0), (H - top - bottom) / (y1 - y0));
    home_t = d3.zoomIdentity.translate(W / 2, top + (H - top - bottom) / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  }

  // ---------- render ----------
  function nodeColor(d) {
    if (d.type === "patent") return d.orphan ? "#2f7684" : COLORS.patent;
    if (d.type === "spinoff") return COLORS.spinoff;
    return d.noText ? "#6d5a3c" : COLORS.startup;
  }

  function render() {
    const act = new Set(activeLinks().map(l => l.source + ">" + l.target));
    linkLayer.selectAll("line").data(simLinks, d => d.source.id + ">" + d.target.id)
      .join("line")
      .attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y)
      .attr("stroke", d => d.kind === "known" ? COLORS.verified : "#f4f2ee")
      .attr("stroke-opacity", d => d.kind === "known" ? 0.9 : d.low ? 0.3 : 0.5)
      .attr("stroke-width", d => d.kind === "known" ? 1.8 : 0.8 + (d.score - M.threshold) * 18)
      .attr("stroke-dasharray", d => d.low ? "3 3" : null)
      .attr("display", d => act.has(d.source.id + ">" + d.target.id) ? null : "none");

    const g = nodeLayer.selectAll("g.node").data(nodes, d => d.id).join(enter => {
      const e = enter.append("g").attr("class", "node");
      e.append("circle").attr("class", "halo");
      e.append("circle").attr("class", "dot");
      e.append("text").attr("class", "label").attr("y", 4);
      e.on("click", (ev, d) => { ev.stopPropagation(); select(d.id); });
      e.append("title");
      return e;
    });
    g.attr("transform", d => `translate(${d.x},${d.y})`);
    g.select("title").text(d => d.label);
    g.select("circle.halo")
      .attr("r", d => d.r + (d.type === "startup" && d.researchless ? 5 : 4))
      .attr("fill", d => d.type === "startup" && d.researchless ? "none" : nodeColor(d))
      .attr("fill-opacity", 0.2)
      .attr("stroke", d => d.type === "startup" && d.researchless ? COLORS.red : "none")
      .attr("stroke-width", 1.6);
    g.select("circle.dot").attr("r", d => d.r).attr("fill", nodeColor)
      .attr("stroke", d => d.type === "startup" && d.spinoff ? COLORS.verified : "none").attr("stroke-width", 1.5);
    g.select("text.label").text(d => d.type === "patent" ? trim(d.label, 34) : trim(d.label, 24));
    clusterLabels();
    applyFocus();
    updateLabels(d3.zoomTransform(svg.node()).k);
  }

  function clusterLabels() {
    const groups = Object.keys(FAMILIES).concat(["STARTUP", "SPINOFF"]);
    const rows = groups.map(k => {
      const members = nodes.filter(n => home(n) === k);
      if (!members.length) return null;
      let x, y, name, stat;
      if (k === "STARTUP") {
        const free = members.filter(n => !n.deg);
        x = d3.mean(free, n => n.x); y = d3.max(free, n => n.y) + 28;
        name = "Lombard startups";
        stat = `${members.length} · ${members.filter(n => n.researchless).length} research-less`;
      } else {
        x = d3.mean(members, n => n.x); y = d3.min(members, n => n.y) - 22;
        if (k === "SPINOFF") { name = "Polimi spin-offs"; stat = `${members.length} medtech or linked`; }
        else { name = `${k} · ${FAMILIES[k]}`; stat = `${members.length} patents · ${members.filter(n => n.orphan).length} orphan`; }
      }
      const short = k === "STARTUP" ? "Startups" : k === "SPINOFF" ? "Spin-offs" : k;
      return { k, x, y, name, stat, short };
    }).filter(Boolean);
    const lab = labelLayer.selectAll("g.cluster-label").data(rows, d => d.k).join(e => {
      const g = e.append("g").attr("class", "cluster-label");
      g.append("text").attr("class", "name");
      g.append("text").attr("class", "stat").attr("dy", 15);
      return g;
    });

    lab.select(".name").text(d => d.name);
    lab.select(".stat").text(d => d.stat);
  }

  function neighbourhood(id) {
    const s = new Set(id ? [id] : []);
    if (id) linksOf(id).forEach(l => { s.add(l.source); s.add(l.target); });
    return s;
  }

  function viewSet() {
    if (state.view === "orphans") return new Set(DATA.orphans.map(p => "P:" + p));
    if (state.view === "researchless") return new Set(DATA.researchless.map(v => "S:" + v));
    if (state.view === "matches") { const s = new Set(); activeLinks().filter(l => l.kind === "similarity").forEach(l => { s.add(l.source); s.add(l.target); }); return s; }
    if (state.view === "verified") { const s = new Set(); activeLinks().filter(l => l.kind === "known").forEach(l => { s.add(l.source); s.add(l.target); }); return s; }
    return null;
  }

  function currentFocus() { return state.selected ? neighbourhood(state.selected) : state.highlight || viewSet(); }

  function updateLabels(k) {
    // Text keeps the same size on screen at every zoom level
    nodeLayer.selectAll("g.node").select("text.label").attr("transform", `scale(${1 / k})`).attr("x", d => (d.r + 5) * k).attr("y", 4);
    labelLayer.selectAll("g.cluster-label").attr("transform", d => `translate(${d.x},${d.y}) scale(${1 / k})`)
      .select(".name").text(d => k < 0.85 ? d.short : d.name);
    labelLayer.selectAll("g.cluster-label").select(".stat").attr("display", k < 0.6 ? "none" : null);
    const focus = currentFocus();
    nodeLayer.selectAll("g.node").select("text.label").attr("display", d => {
      if (state.selected) return focus.has(d.id) ? null : "none";
      if (focus) return focus.has(d.id) && (focus.size <= 40 || d.deg >= 1 || k > 1.6) ? null : "none";
      return (d.deg >= 3 && k >= 0.7) || (d.deg >= 1 && k >= 1.6) || k >= 2.6 ? null : "none";
    });
    labelLayer.attr("opacity", state.selected ? 0.12 : k > 2.2 ? 0.25 : 1);
  }

  function applyFocus() {
    const focus = currentFocus();
    nodeLayer.selectAll("g.node").classed("faded", d => !!focus && !focus.has(d.id));
    linkLayer.selectAll("line").classed("faded", d => !!focus && !(focus.has(d.source.id) && focus.has(d.target.id)));
    const n = state.selected && nodeById.get(state.selected);
    if (n) reticle.attr("transform", `translate(${n.x},${n.y})`).attr("opacity", 1);
    else reticle.attr("opacity", 0);
  }

  function sheetOpen() { return sheet.classList.contains("open"); }
  function zoomTo(idSet, pad = 120) {
    const pts = [...idSet].map(id => nodeById.get(id)).filter(Boolean);
    if (!pts.length) return;
    const side = sheetOpen() && innerWidth > 700 ? Math.min(560, innerWidth) : 0;
    const bottom = sheetOpen() && innerWidth <= 700 ? innerHeight * 0.78 : 0;
    const x0 = d3.min(pts, d => d.x), x1 = d3.max(pts, d => d.x), y0 = d3.min(pts, d => d.y), y1 = d3.max(pts, d => d.y);
    const availW = W - side, availH = H - bottom - 230;
    const k = Math.max(0.6, Math.min(3, Math.min(availW / (x1 - x0 + pad * 2), availH / (y1 - y0 + pad * 2))));
    const t = d3.zoomIdentity.translate(availW / 2, 130 + availH / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    svg.transition().duration(reduced ? 0 : 750).call(zoom.transform, t);
  }
  function resetZoom() { svg.transition().duration(reduced ? 0 : 600).call(zoom.transform, home_t); }

  // ---------- selection, entity sheet ----------
  const sheet = document.getElementById("sheet"), sheetBody = document.getElementById("sheetBody"), sheetKind = document.getElementById("sheetKind");
  const crumbSel = document.getElementById("crumbSel");
  function token(id) { return id ? id.replace(":", "-").replace(/[^A-Za-z0-9._~-]/g, "") : ""; }
  const byToken = new Map(DATA.nodes.map(n => [token(n.id), n.id]));

  function select(id, opts = {}) {
    state.selected = id && byId.has(id) ? id : null;
    if (state.selected) {
      stopTour(false);
      openSheet();
      renderEntity(state.selected);
      crumbSel.hidden = false; crumbSel.textContent = trim(byId.get(state.selected).label, 40);
      try { history.replaceState(null, "", "#" + token(state.selected)); } catch (e) {}
      if (!opts.noZoom) zoomTo(neighbourhood(state.selected), 90);
    } else {
      if (!(state.agent && !opts.keepSheet)) closeSheet();
      if (state.agent && !opts.keepSheet) setAgent(true);
      crumbSel.hidden = true;
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    }
    applyFocus(); updateLabels(d3.zoomTransform(svg.node()).k);
  }

  function openSheet() { sheet.classList.add("open"); sheet.setAttribute("aria-hidden", "false"); }
  function closeSheet() { sheet.classList.remove("open"); sheet.setAttribute("aria-hidden", "true"); }
  document.getElementById("sheetClose").addEventListener("click", () => { if (state.agent && !state.selected) setAgent(false); else select(null, { keepSheet: false }); closeSheet(); });
  document.getElementById("crumbMap").addEventListener("click", () => { state.highlight = null; state.view = "all"; select(null); resetZoom(); });

  const KIND = { patent: "Polimi patent", startup: "Startup", spinoff: "Polimi spin-off" };
  function code(n) { return { patent: "PAT", startup: "STU", spinoff: "SPN" }[n.type] + "-" + n.ref.toUpperCase().slice(0, 16); }
  function status(n) {
    if (n.type === "patent") return n.orphan ? (n.industry ? ["Industry", "ok"] : ["Orphan", ""]) : ["Matched", "ok"];
    if (n.type === "startup") return n.spinoff ? ["Spin-off", "ok"] : n.researchless ? ["No tie", ""] : n.noText ? ["Not read", ""] : ["Startup", "ok"];
    return ["Spin-off", "ok"];
  }

  function tldr(n) {
    const L = linksOf(n.id), sims = L.filter(l => l.kind === "similarity"), known = L.filter(l => l.kind === "known");
    if (n.type === "patent") {
      const base = `A Politecnico di Milano patent in ${n.group} (${(FAMILIES[n.group] || "medtech").toLowerCase()}), priority ${n.priority}.`;
      if (known.length) return base + ` Co-filed with ${known.map(l => byId.get(l.target).label).join(", ")}, a Polimi spin-off.`;
      if (sims.length) return base + ` ${sims.length} Lombard startup${sims.length > 1 ? "s" : ""} within reach, closest ${byId.get(sims[0].target).label} at ${fmt(sims[0].score)}.`;
      const best = n.bestStartup && byId.get(n.bestStartup);
      return base + (n.industry ? ` Co-filed with ${n.industry}, so it has an industrial partner, but no startup is close.`
        : ` No Lombard startup within reach${best ? `: the closest is ${best.label} at ${fmt(n.best)}` : ""}.`);
    }
    if (n.type === "startup") {
      const base = `A Lombard innovative startup${n.place ? ` based in ${n.place}` : ""}${n.founded ? `, active since ${n.founded}` : ""}.`;
      if (n.spinoff) return base + " An accredited Polimi spin-off.";
      if (n.noText) return base + " Its website gave no description, so it was not compared with Polimi patents.";
      if (sims.length) return base + ` Close to ${sims.length} Polimi patent${sims.length > 1 ? "s" : ""} with no known tie to Polimi.`;
      return base + ` No Polimi patent at or above ${state.min.toFixed(2)}.`;
    }
    return `An accredited Politecnico di Milano spin-off${n.founded ? `, incorporated in ${n.founded}` : ""}.${known.length ? ` ${known.length} verified link${known.length > 1 ? "s" : ""} on this map.` : ""}`;
  }

  function miniMap(n) {
    const L = linksOf(n.id).slice(0, 7);
    const pts = L.map((l, i) => {
      const other = byId.get(l.source === n.id ? l.target : l.source);
      const a = -Math.PI / 2 + i * 2 * Math.PI / Math.max(L.length, 1);
      return { x: 50 + 30 * Math.cos(a), y: 55 + 30 * Math.sin(a), c: l.kind === "known" ? COLORS.verified : COLORS[other.type] };
    });
    return `<svg viewBox="0 0 100 110" aria-hidden="true">${pts.map(p => `<line x1="50" y1="55" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#f4f2ee" stroke-opacity="0.35" stroke-width="0.8"/>`).join("")}
      ${pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.4" fill="${p.c}"/>`).join("")}
      <circle cx="50" cy="55" r="7" fill="none" stroke="${COLORS.verified}" stroke-width="1.2"/><circle cx="50" cy="55" r="3.6" fill="${COLORS[n.type]}"/></svg>`;
  }

  const href = url => /^https?:/.test(url) ? url : "https://" + url;

  function renderEntity(id) {
    const n = byId.get(id), L = linksOf(id);
    const [stamp, stampCls] = status(n);
    sheetKind.innerHTML = `<i class="dotmark" style="background:${COLORS[n.type]}"></i>Entity / ${esc(KIND[n.type])}`;
    if (state.agent) { sheetBody.innerHTML = agentView(n); bindAgent(); return; }
    const facts = [];
    let links = "";
    if (n.type === "patent") {
      facts.push(["Publication", `<span class="mono">${esc(n.ref)}</span>`], ["Priority", `<span class="mono">${esc(n.priority)}</span>`],
        ["IPC", `<span class="mono">${esc(n.ipcAll)}</span>`], ["Applicants", esc(n.applicants)]);
      links = `<a class="btn" href="https://worldwide.espacenet.com/patent/search?q=pn%3D${encodeURIComponent(n.ref)}" target="_blank" rel="noopener">Espacenet ↗</a>`;
    } else if (n.type === "startup") {
      facts.push(["Company", esc(n.legal)], ["Based in", esc(n.place)], ["Sector", esc(n.sector)], ["Tax code", `<span class="mono">${esc(n.ref)}</span>`]);
      if (n.website) links = `<a class="btn" href="${esc(href(n.website))}" target="_blank" rel="noopener">Site ↗</a>`;
    } else {
      facts.push(["Company", esc(n.legal)], ["Founded", `<span class="mono">${esc(n.founded)}</span>`]);
      links = (n.website ? `<a class="btn" href="${esc(href(n.website))}" target="_blank" rel="noopener">Site ↗</a>` : "") +
        `<a class="btn" href="${esc(n.evidence)}" target="_blank" rel="noopener">Polimi TTO ↗</a>`;
    }
    const chips = [`<span class="chip"><i class="dotmark" style="background:${COLORS[n.type]}"></i>${esc(KIND[n.type])}</span>`];
    if (n.titleOnly) chips.push(`<span class="chip" style="color:${COLORS.red}">Title only</span>`);
    if (n.industry) chips.push(`<span class="chip">Industrial partner</span>`);
    sheetBody.innerHTML = `
      <div class="entity-top">
        <div>
          <span class="code" style="color:${COLORS.verified}"><i class="dotmark" style="background:${COLORS.verified}"></i>${esc(code(n))}</span>
          <h2 class="entity-name">${esc(n.label)}</h2>
          <div class="chips">${chips.join("")}</div>
        </div>
        <div class="dossier" aria-hidden="true"><span class="clip"></span>
          <div class="head"><span>FILE №</span><span>${esc(code(n).slice(0, 12))}</span></div>
          ${miniMap(n)}<span class="stamp ${stampCls}">${esc(stamp.toUpperCase())}</span>
          <div class="who">${esc(trim(n.label, 28))}</div><div class="sub">${L.length} link${L.length === 1 ? "" : "s"} · ≥ ${state.min.toFixed(2)}</div>
        </div>
      </div>
      <div class="tldr"><p>${esc(tldr(n))}</p><span class="caps">TL;DR · a summary of the facts below</span></div>
      ${links ? `<div class="actions">${links}</div>` : ""}
      <div class="caps section-title">${L.length ? `Links (${L.length})` : "No links at this threshold"}</div>
      ${L.length ? `<div class="links">${L.map(l => linkRow(l, id)).join("")}</div>` : ""}
      ${n.text ? `<div class="caps section-title">${n.type === "patent" ? "Abstract" : "What they do"}</div><p class="prose">${esc(n.text)}</p>` : ""}
      ${n.mt ? `<p class="note">${n.type === "patent" ? "Title" : "Text"} machine-translated from Italian.</p>` : ""}
      <div class="caps section-title">Facts</div>
      <dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
    sheetBody.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(b.dataset.go)));
    sheetBody.scrollTop = 0;
  }

  function linkRow(l, id) {
    const other = byId.get(l.source === id ? l.target : l.source);
    if (l.kind === "known") {
      const why = l.relation === "same_company" ? "Same company: accredited Polimi spin-off" : "Co-applicant of the Polimi patent";
      return `<button class="link-row" data-go="${esc(other.id)}"><span class="who">${esc(other.label)}</span><span class="score" style="color:${COLORS.verified}">VERIFIED</span><span class="why">${esc(why)}</span></button>`;
    }
    const w = Math.max(4, Math.min(100, (l.score - 0.4) / 0.3 * 100));
    return `<button class="link-row" data-go="${esc(other.id)}"><span class="who">${esc(trim(other.label, 70))}</span><span class="score">${fmt(l.score)}</span>
      <span class="meter"><i style="width:${w}%"></i></span><span class="why">${esc(l.terms.join(" · "))}${l.low ? " · title-only patent" : ""}</span></button>`;
  }

  // ---------- agent view ----------
  function entityJSON(n) {
    const L = linksOf(n.id).map(l => {
      const o = byId.get(l.source === n.id ? l.target : l.source);
      return l.kind === "known" ? { with: o.label, id: o.ref, type: o.type, relation: l.relation, evidence: l.evidence }
        : { with: o.label, id: o.ref, type: o.type, similarity: l.score, title_only_patent: l.low, terms: l.terms };
    });
    const base = { type: n.type, id: n.ref, name: n.label, summary: tldr(n) };
    if (n.type === "patent") Object.assign(base, { priority_year: n.priority, ipc: n.ipcAll.split(" · "), applicants: n.applicants.split(" · "), orphan: n.orphan, industrial_co_applicants: n.industry || null, abstract: n.text || null });
    if (n.type === "startup") Object.assign(base, { legal_name: n.legal, municipality: n.place, sector_nace: n.sector, website: n.website || null, polimi_spinoff: n.spinoff, research_less: n.researchless, description_en: n.text || null, machine_translated: !!n.mt });
    if (n.type === "spinoff") Object.assign(base, { legal_name: n.legal, founded: n.founded, website: n.website || null, source: n.evidence, description: n.text || null });
    base.links = L;
    return base;
  }
  function overviewJSON() {
    return {
      dataset: "Polimi MedTech Transfer Map", built: M.built, model: M.model, threshold: M.threshold,
      counts: { patents: M.nPatents, startups: M.nStartups, startups_with_description: M.nStartupsText, similarity_links: allLinks.filter(l => l.kind === "similarity").length, known_links: allLinks.filter(l => l.kind === "known").length, orphan_technologies: DATA.orphans.length, research_less_startups: DATA.researchless.length },
      research_less_startups: DATA.researchless.map(v => byId.get("S:" + v)).filter(Boolean).map(n => {
        const top = linksOf(n.id, allLinks).filter(l => l.kind === "similarity")[0];
        return { name: n.label, tax_code: n.ref, best_match: top ? { patent: top.source.slice(2), score: top.score, title_only_patent: top.low } : null };
      }),
      orphan_technologies: DATA.orphans.map(p => byId.get("P:" + p)).filter(Boolean).map(n => ({ patent: n.ref, title: n.label, family: n.group, best_score: n.best, industrial_partner: !!n.industry })),
      caveats: ["Similarity is a signal, not proof of fit.", "Licences and informal collaborations are mostly not public.", "Only organisations are listed, never inventors or founders."],
    };
  }
  function agentView(n) {
    const json = JSON.stringify(n ? entityJSON(n) : overviewJSON(), null, 2);
    return `<div class="agent"><p class="note">Plain data for language models and scripts: ${n ? "this entity and its links" : "the whole map in summary"}.</p>
      <div class="actions"><button class="btn" id="copyJson">Copy JSON</button></div><pre id="agentPre">${esc(json)}</pre></div>`;
  }
  function bindAgent() {
    const b = document.getElementById("copyJson"); if (!b) return;
    b.addEventListener("click", () => {
      const pre = document.getElementById("agentPre");
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selected: press Ctrl+C"; };
      try { navigator.clipboard.writeText(pre.textContent).then(() => { b.textContent = "Copied"; }, fallback); } catch (e) { fallback(); }
    });
  }
  const humanBtn = document.getElementById("humanBtn"), agentBtn = document.getElementById("agentBtn");
  function setAgent(on) {
    state.agent = on;
    humanBtn.setAttribute("aria-checked", String(!on)); agentBtn.setAttribute("aria-checked", String(on));
    if (state.selected) renderEntity(state.selected);
    else if (on) { sheetKind.textContent = "Agent / Overview"; sheetBody.innerHTML = agentView(null); bindAgent(); openSheet(); }
    else closeSheet();
  }
  humanBtn.addEventListener("click", () => setAgent(false));
  agentBtn.addEventListener("click", () => setAgent(true));

  // ---------- menu ----------
  const menu = document.getElementById("menu"), menuBtn = document.getElementById("menuBtn"), menuBody = document.getElementById("menuBody");
  function openMenu() { menu.classList.add("open"); menu.setAttribute("aria-hidden", "false"); menuBtn.setAttribute("aria-expanded", "true"); renderMenu(); }
  function closeMenu() { menu.classList.remove("open"); menu.setAttribute("aria-hidden", "true"); menuBtn.setAttribute("aria-expanded", "false"); }
  menuBtn.addEventListener("click", () => menu.classList.contains("open") ? closeMenu() : openMenu());
  document.getElementById("menuClose").addEventListener("click", closeMenu);

  const maxScore = Math.max(M.threshold, ...allLinks.filter(l => l.score).map(l => l.score));
  const VIEWS = [
    ["all", "Everything", `${DATA.nodes.length} dots`],
    ["matches", "Matches only", `${allLinks.filter(l => l.kind === "similarity").length} lines`],
    ["researchless", "Research-less startups", `${DATA.researchless.length}`],
    ["orphans", "Orphan technologies", `${DATA.orphans.length}`],
    ["verified", "Verified ties", `${allLinks.filter(l => l.kind === "known").length}`],
  ];
  let listTab = "researchless";
  function renderMenu() {
    menuBody.innerHTML = `
      <div class="menu-group"><h2>Views</h2>${VIEWS.map(([k, t, s]) => `<button class="option" data-view="${k}" aria-pressed="${state.view === k}"><span>${t}</span><small>${s}</small></button>`).join("")}</div>
      <div class="menu-group"><h2>Filters</h2>
        <label class="range" for="minScore"><span>Minimum similarity <b class="mono" id="minOut">${state.min.toFixed(2)}</b></span>
          <input id="minScore" type="range" min="${M.threshold}" max="${(Math.floor(maxScore * 100) / 100).toFixed(2)}" step="0.01" value="${state.min}"></label>
        <label class="check" for="hideLow"><input id="hideLow" type="checkbox" ${state.hideLow ? "checked" : ""}> Hide matches from title-only patents</label>
      </div>
      <div class="menu-group"><h2>Lists</h2>
        <div class="tabs"><button class="option" style="width:auto" data-tab="researchless" aria-pressed="${listTab === "researchless"}">Research-less · ${DATA.researchless.length}</button><button class="option" style="width:auto" data-tab="orphans" aria-pressed="${listTab === "orphans"}">Orphans · ${DATA.orphans.length}</button></div>
        <div class="table-wrap">${listTab === "orphans" ? orphanTable() : rlTable()}</div>
      </div>
      <div class="menu-group"><h2>Legend</h2><div class="legend">
        <span><i style="background:${COLORS.patent}"></i>Polimi patent (darker: orphan)</span>
        <span><i style="background:${COLORS.startup}"></i>Lombard startup</span>
        <span><i style="border:2px solid ${COLORS.red}"></i>Research-less startup</span>
        <span><i style="background:${COLORS.spinoff}"></i>Polimi spin-off</span>
        <span><i class="line" style="border-color:${COLORS.verified}"></i>Verified tie</span>
        <span><i class="line" style="border-color:#f4f2ee;border-top-style:dashed"></i>Match from a title-only patent</span></div></div>
      <div class="menu-group"><h2>Sources</h2>
        <p class="note">Patents: Polimi applications in IPC A61B, A61F, A61L, A61M, A61N, G16H (Espacenet), abstracts from EPO Open Patent Services. Startups: InfoCamere register of innovative startups (list of ${esc(M.startupList)}), Lombardy, ATECO 32.50 / 26.60 or medtech keywords; descriptions from each company's homepage, Italian texts machine-translated (Helsinki-NLP opus-mt-it-en). Spin-offs: Polimi Technology Transfer Office public list (${M.nSpinoffsListed} listed).</p>
        <p class="note">Similarity: cosine between multilingual sentence embeddings (<span class="mono">${esc(M.model)}</span>), threshold ${M.threshold} calibrated on hand-labelled pairs. A signal, not proof of fit. Only organisations are shown. Built ${esc(M.built)}.</p>
      </div>`;
    menuBody.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => { setView(b.dataset.view); renderMenu(); }));
    menuBody.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => { listTab = b.dataset.tab; renderMenu(); }));
    const r = menuBody.querySelector("#minScore");
    r.addEventListener("input", () => { state.min = +r.value; menuBody.querySelector("#minOut").textContent = state.min.toFixed(2); refresh(); });
    menuBody.querySelector("#hideLow").addEventListener("change", e => { state.hideLow = e.target.checked; refresh(); });
    menuBody.querySelectorAll("tr[data-go]").forEach(tr => {
      const go = () => { closeMenu(); select(tr.dataset.go); };
      tr.addEventListener("click", go); tr.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    });
  }
  function rlTable() {
    const rows = DATA.researchless.map(v => byId.get("S:" + v)).filter(Boolean).map(n => {
      const top = linksOf(n.id, allLinks).filter(l => l.kind === "similarity")[0];
      const p = top && byId.get(top.source);
      return `<tr tabindex="0" data-go="${esc(n.id)}"><td>${esc(n.label)}<small>${esc(n.place)}${top && top.low ? " · title-only match" : ""}</small></td><td>${p ? esc(trim(p.label, 60)) : "–"}</td><td class="num">${top ? fmt(top.score) : "–"}</td></tr>`;
    }).join("");
    return `<table><thead><tr><th>Startup</th><th>Closest Polimi patent</th><th style="text-align:right">Score</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  function orphanTable() {
    const rows = DATA.orphans.map(p => byId.get("P:" + p)).filter(Boolean).map(n => {
      const b = n.bestStartup && byId.get(n.bestStartup);
      return `<tr tabindex="0" data-go="${esc(n.id)}"><td>${esc(trim(n.label, 70))}<small>${esc(n.ref)} · ${esc(n.group)}${n.industry ? " · industrial partner" : ""}</small></td><td>${b ? esc(b.label) : "–"}</td><td class="num">${fmt(n.best)}</td></tr>`;
    }).join("");
    return `<table><thead><tr><th>Patent</th><th>Closest startup</th><th style="text-align:right">Best</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  function setView(v) {
    state.view = v; state.highlight = null; stopTour(false); select(null);
    const s = viewSet();
    if (s && s.size) zoomTo(s, 60); else resetZoom();
  }
  function refresh() { render(); if (state.selected) renderEntity(state.selected); }

  // ---------- search ----------
  const search = document.getElementById("search"), q = document.getElementById("q"), results = document.getElementById("results");
  let active = 0, found = [];
  function openSearch() { search.hidden = false; q.value = ""; doSearch(); q.focus(); }
  function closeSearch() { search.hidden = true; document.getElementById("searchBtn").focus(); }
  document.getElementById("searchBtn").addEventListener("click", openSearch);
  search.addEventListener("click", e => { if (e.target === search) closeSearch(); });
  function doSearch() {
    const t = q.value.trim().toLowerCase();
    found = !t ? DATA.researchless.map(v => byId.get("S:" + v)).filter(Boolean).slice(0, 8)
      : DATA.nodes.filter(n => (n.label + " " + n.ref + " " + (n.legal || "") + " " + (n.text || "")).toLowerCase().includes(t))
          .sort((a, b) => (b.label.toLowerCase().includes(t)) - (a.label.toLowerCase().includes(t))).slice(0, 12);
    active = 0;
    results.innerHTML = (!t ? `<span class="caps" style="color:var(--muted);padding:6px 14px">Research-less startups</span>` : "") +
      (found.length ? found.map((n, i) => `<button class="result ${i === active ? "active" : ""}" role="option" data-go="${esc(n.id)}"><i class="dotmark" style="background:${COLORS[n.type]}"></i><span>${esc(trim(n.label, 60))}</span><span>${esc(KIND[n.type])}</span></button>`).join("")
        : `<p class="note" style="padding:6px 14px">Nothing matches “${esc(q.value)}”. Try a company name, a publication number or a word like “stent”.</p>`);
    results.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { closeSearch(); select(b.dataset.go); }));
  }
  q.addEventListener("input", doSearch);
  q.addEventListener("keydown", e => {
    const items = results.querySelectorAll(".result");
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && items.length) {
      e.preventDefault(); active = (active + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items.forEach((it, i) => it.classList.toggle("active", i === active));
    } else if (e.key === "Enter" && found[active]) { closeSearch(); select(found[active].id); }
  });

  // ---------- tour and ticker ----------
  const nSim = allLinks.filter(l => l.kind === "similarity");
  const nKnown = allLinks.filter(l => l.kind === "known").length;
  const ids = f => new Set(DATA.nodes.filter(f).map(n => n.id));
  const STEPS = [
    { t: `${M.nPatents} medical patents from Politecnico di Milano`, p: "Every blue dot is a Polimi patent family in the medtech IPC classes, read from Espacenet with its abstract from the EPO Open Patent Services. Inventors are counted, never named.", f: () => ids(n => n.type === "patent") },
    { t: "Six technology families", p: "Patents sit in clusters by their main IPC subclass: diagnosis and surgery, drug delivery, prostheses, biomaterials, electro and radiation therapy, health informatics. This is the biggest: diagnosis and surgery.", f: () => ids(n => n.type === "patent" && n.group === "A61B") },
    { t: `${M.nStartups} Lombard medtech startups`, p: `Amber dots are innovative startups registered in Lombardy (InfoCamere list of ${M.startupList}). ${M.nStartupsText} describe themselves on their website, which is what the map reads; the rest stay dim.`, f: () => ids(n => n.type === "startup") },
    { t: "How a line is drawn", p: `A white line joins a patent and a startup whose texts are semantically close: a score of ${M.threshold} or more on a multilingual embedding model. ${nSim.length} pairs pass. Dashed lines start from patents with only a title, so they are less reliable.`, f: () => { const s = new Set(); nSim.forEach(l => { s.add(l.source); s.add(l.target); }); return s; } },
    { t: "Verified ties", p: `Green marks what public sources confirm: startups that are Polimi spin-offs, and companies that co-filed a Polimi patent. Only ${nKnown} such ties are visible in open data.`, f: () => { const s = new Set(); allLinks.filter(l => l.kind === "known").forEach(l => { s.add(l.source); s.add(l.target); }); return s; } },
    { t: `${DATA.researchless.length} research-less startups`, p: "Red rings mark startups close to a Polimi patent with no known tie to Polimi: conversations that could start tomorrow.", f: () => new Set(DATA.researchless.map(v => "S:" + v)) },
    { t: `${DATA.orphans.length} orphan technologies`, p: `Darker blue dots are patents with no spin-off and no Lombard startup within reach. ${DATA.nodes.filter(n => n.orphan && n.industry).length} of them already have an industrial co-applicant, so they are orphan only with respect to startups.`, f: () => new Set(DATA.orphans.map(p => "P:" + p)) },
    { t: "What is missing", p: "Licences and informal collaborations are mostly not public, older companies are not in the startup register, and similarity is a signal, not proof. Treat every gap as a lead to check.", f: () => null },
  ];
  let step = -1;
  const card = document.getElementById("tourCard");
  document.getElementById("tourLabel").textContent = `Data tour · ${STEPS.length}`;
  function showStep(i) {
    closeMenu(); select(null, { noZoom: true });
    step = i;
    const s = STEPS[i], set = s.f();
    state.highlight = set; state.view = "all"; applyFocus(); updateLabels(d3.zoomTransform(svg.node()).k);
    if (set && set.size) zoomTo(set, 70); else resetZoom();
    card.hidden = false;
    card.innerHTML = `<span class="caps" style="color:var(--red)">Step ${i + 1} of ${STEPS.length}</span><h2>${esc(s.t)}</h2><p>${esc(s.p)}</p>
      <div class="tour-nav"><button class="btn" id="tPrev" ${i === 0 ? "disabled" : ""}>Back</button><button class="btn" id="tEnd">End</button><button class="btn" id="tNext">${i === STEPS.length - 1 ? "Finish" : "Next"}</button></div>`;
    document.getElementById("tPrev").onclick = () => showStep(Math.max(0, step - 1));
    document.getElementById("tNext").onclick = () => step === STEPS.length - 1 ? stopTour(true) : showStep(step + 1);
    document.getElementById("tEnd").onclick = () => stopTour(true);
    document.getElementById("tNext").focus({ preventScroll: true });
  }
  function stopTour(reset) {
    if (step < 0) return;
    step = -1; card.hidden = true; state.highlight = null; applyFocus(); updateLabels(d3.zoomTransform(svg.node()).k);
    if (reset) resetZoom();
  }
  document.getElementById("tourBtn").addEventListener("click", () => showStep(0));

  const FACTS = [
    ["Where the map starts", `${M.nPatents} Polimi medtech patents`, 0],
    ["Who could use them", `${M.nStartups} Lombard medtech startups`, 2],
    ["How lines are drawn", `${nSim.length} matches at ≥ ${M.threshold}`, 3],
    ["What is verified", `${nKnown} public ties`, 4],
    ["The opportunity", `${DATA.researchless.length} startups near Polimi research with no tie`, 5],
    ["The gap", `${DATA.orphans.length} technologies with no startup in reach`, 6],
    ["Read with care", "what open data cannot show", 7],
  ];
  const tick = FACTS.map(([h, t, s]) => `<button data-step="${s}"><b>${esc(h)}</b>${esc(t)}</button>`).join("");
  const track = document.getElementById("ticker");
  track.innerHTML = tick + tick.replace(/<button /g, '<button tabindex="-1" aria-hidden="true" ');
  track.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => showStep(+b.dataset.step)));

  // ---------- keyboard ----------
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (!search.hidden) closeSearch();
      else if (menu.classList.contains("open")) closeMenu();
      else if (step >= 0) stopTour(true);
      else if (state.selected) select(null);
    }
    if (e.key === "/" && search.hidden && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
  });

  // ---------- boot ----------
  drawStars();
  layout();
  render();
  svg.call(zoom.transform, home_t);
  const start = byToken.get(decodeURIComponent(location.hash.slice(1)));
  if (start) select(start);
  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { drawStars(); layout(); render(); if (!state.selected) svg.call(zoom.transform, home_t); }, 200); });
})();
</script>
